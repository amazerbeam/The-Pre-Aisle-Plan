      + ellH(GEOMETRY.RUG.cu, GEOMETRY.RUG.cv, 1, GEOMETRY.RUG.ru - 10, GEOMETRY.RUG.rv - 8, '#fbc6d9', { stroke: null })
  },
  effects: {
    gauge: (level, pct) => {
      const [u, v, h] = GEOMETRY.STATION_ANCHORS.fridgeTop[level - 1];
      const w = (34 * pct) / 100;
      return bill(u, v, h + GEOMETRY.FRIDGE_GAUGE_LIFT, `<rect x="-19" y="-7" width="38" height="10" rx="5" fill="#fff" stroke="${ART_INK}" stroke-width="1.4"/>`
        + (w > 0 ? `<rect x="-17" y="-5" width="${fmt(w)}" height="6" rx="3" fill="${gaugeColour(pct)}"/>` : ''), [-19, -7, 19, 3]);
    },
    steam: level => {
      const [u, v, h] = GEOMETRY.STATION_ANCHORS.cookerPot[level - 1];
      return bill(u, v, h, fxg('steam', '<path d="M-4 -4 q5 -8 0 -14 M5 -6 q5 -8 0 -14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>'), [-6, -20, 10, 0]);
    },
    zzz: level => {
      const [u, v, h] = GEOMETRY.STATION_ANCHORS.bedTop[level - 1];
      return bill(u, v, h + GEOMETRY.SLEEP_Z_LIFT, fxg('zzz', '<text x="10" y="0" font-size="15" font-weight="700" fill="#fff">z</text><text x="22" y="-12" font-size="11" font-weight="700" fill="#fff">z</text>'), [10, -22, 30, 4]);
    },
    servedPlate: level => {
      const [u, v, h] = GEOMETRY.STATION_ANCHORS.cookerPlate[level - 1];
      return bill(u, v, h, `<ellipse cx="0" cy="-2" rx="11" ry="4.5" fill="#fff" stroke="${ART_INK}" stroke-width="1.4"/><path d="M-7 -4 q7 -10 14 0z" fill="#f4a259" stroke="${ART_INK}" stroke-width="1.2"/>`, [-11, -12, 11, 3]);
    },
    nightDim: () => `<rect class="night-dim" x="${GEOMETRY.ROOM_WORLD.x}" y="${GEOMETRY.ROOM_WORLD.y}" width="${GEOMETRY.ROOM_WORLD.width}" height="${GEOMETRY.ROOM_WORLD.height}" fill="${GEOMETRY.NIGHT_DIM_FILL}" pointer-events="none"/>`
  }
};
</script>
<script id="room-engine">
/* ======================================================================
   Room engine. renderRoomSVG(pack, state, opts?) -> an SVG string; thumbSVG(pack, kind, id, level) -> a cropped SVG string.
   Pure (no document / window): the node smoke loads this block. Draw order follows the live PetRoom:
   backdrop -> rug -> wall decor -> back stations (wardrobe, cooker, fridge, cabinet) -> back-floor decor -> bed
   (back, sleeping creature, front) -> creature -> front-floor decor -> effects -> overlay.
   Effects are drawn in a station's own (unshifted) art coords, inside that station's shifted group, so they follow it.
   ====================================================================== */
const WORLD = GEOMETRY.ROOM_WORLD;
const WORLD_VIEWBOX = `${WORLD.x} ${WORLD.y} ${WORLD.width} ${WORLD.height}`;
const SPOT_OF = IDS.decor;
const LEGACY_SET = new Set(LEGACY_IDS);
const FALLBACK_WALL = { left: '#bdbdbd', right: '#d6d6d6', skirting: '#9e9e9e' };
const FALLBACK_FLOOR = { base: '#c9c9c9' };
const FIT_TOLERANCE = 1; // px: outline stroke and billboard rounding

function defaultState() {
  const placements = {};
  for (const spot of DECOR_SPOTS) placements[spot] = null;
  placements.rug = 'rug-pink';
  return {
    night: false, wallStyle: 'wall-white', floorStyle: 'floor-lilac',
    levels: { ...DEFAULT_ROOM_LEVELS }, placements,
    form: 3, fridgePct: 50, cooking: false, sleeping: false, served: false, overlay: false, herb: false
  };
}

/* ---------- missing art: a visible red dashed box, never a blank ---------- */
function missingBox(b, id) {
  return `<rect class="missing" x="${n1(b.x)}" y="${n1(b.y)}" width="${n1(b.width)}" height="${n1(b.height)}" fill="rgba(229,57,53,.13)" stroke="#e53935" stroke-width="1.4" stroke-dasharray="4 3"/>`
    + `<text x="${n1(b.x + 3)}" y="${n1(b.y + 10)}" font-size="9" font-weight="700" fill="#c62828" font-family="system-ui,sans-serif">missing: ${id}</text>`;
}
const stackBox = miss => ({ x: WORLD.x + 6, y: WORLD.y + 6 + miss.n++ * 14, width: 168, height: 12 });

/** Call a pack part (fn may be absent): its string, or a stacked missing box naming it. */
function part(fn, args, id, miss) {
  return typeof fn === 'function' ? fn(...args) : missingBox(stackBox(miss), id);
}

/* ---------- boxes ---------- */
const footBox = (station, level) => boundsOf(boxCorners(...footprint3(station, level)));
function footBoxWorld(station, level) {
  const [dx, dy] = shiftPx(GEOMETRY.STATION_SHIFT[station]);
  const b = footBox(station, level);
  return { ...b, x: b.x + dx, y: b.y + dy };
}
const spotBox = spot => boundsOf(boxCorners(...GEOMETRY.DECOR_SPOT_SHAPES[spot].volume));

/* ---------- stations, decor, creature ---------- */
/** One station level's art as { back, front } (a plain string is all `back`), or null when the pack has none. */
function stationParts(pack, station, level) {
  const fn = pack.stations?.[station]?.[level - 1];
  if (typeof fn !== 'function') return null;
  const out = fn();
  return typeof out === 'string' ? { back: out, front: '' } : { back: out.back || '', front: out.front || '' };
}

/** A decor id's art in world coords (legacy ids are drawn in their MPP-27 coords and slid to their spot), or null. */
function decorArtWorld(pack, id) {
  const fn = pack.decor?.[id];
  if (typeof fn !== 'function') return null;
  const art = fn();
  const shift = LEGACY_SET.has(id) ? GEOMETRY.DECOR_LEGACY_SHIFT[SPOT_OF[id]] : null;
  return shift ? `<g transform="${shiftTransform(shift)}">${art}</g>` : art;
}

function creatureAt(pose, form) {
  const [x, y] = P(...pose.anchor);
  const k = pose.scale;
  return `<g class="room-creature" transform="translate(${n1(x - FOOT_X * k)},${n1(y + pose.dropPx - FOOT_Y * k)}) scale(${k})">${creatureSVG(form, pose.face)}</g>`;
}

function effectAt(fn, args, id, anchor) {
  if (typeof fn === 'function') return fn(...args);
  const [x, y] = P(...anchor);
  return missingBox({ x: x - 34, y: y - 18, width: 68, height: 12 }, id);
}

function stationGroup(pack, st, station, miss) {
  const level = resolveRoomLevels(st.levels)[station];
  const parts = stationParts(pack, station, level);
  const fx = pack.effects || {};
  let inner = '';
  if (station === 'bed') {
    const sleeping = st.sleeping;
    inner += parts ? parts.back : missingBox(footBox(station, level), `${station}:L${level}`);
    if (sleeping && !st.herb) inner += creatureAt(pipPose('bed', 'sleep', st.levels), st.form);
    if (sleeping && !st.herb) inner += effectAt(fx.zzz, [level], 'effect:zzz', [...GEOMETRY.STATION_ANCHORS.bedTop[level - 1]]);
    if (parts) inner += parts.front;
  } else {
    inner += parts ? parts.back + parts.front : missingBox(footBox(station, level), `${station}:L${level}`);
    if (station === 'fridge' && st.fridgePct != null) inner += effectAt(fx.gauge, [level, st.fridgePct], 'effect:gauge', GEOMETRY.STATION_ANCHORS.fridgeTop[level - 1]);
    if (station === 'cooker' && (st.cooking || st.served)) inner += effectAt(fx.steam, [level], 'effect:steam', GEOMETRY.STATION_ANCHORS.cookerPot[level - 1]);
    if (station === 'cooker' && st.served) inner += effectAt(fx.servedPlate, [level], 'effect:servedPlate', GEOMETRY.STATION_ANCHORS.cookerPlate[level - 1]);
  }
  return `<g data-station="${station}" transform="${shiftTransform(GEOMETRY.STATION_SHIFT[station])}">${inner}</g>`;
}

function decorLayer(pack, st, layer) {
  return GEOMETRY.DECOR_LAYERS[layer].map(spot => {
    const id = st.placements[spot];
    if (!id) return '';
    return decorArtWorld(pack, id) ?? missingBox(spotBox(spot), `decor:${id}`);
  }).join('');
}

/* ---------- backdrop: walls, floor, skirting, window and sill from the pack's styles and backdrop ---------- */
function backdropSVG(pack, st, miss) {
  const { u: RU, v: RV, h: WH } = GEOMETRY.ROOM_SIZE;
  const bd = pack.backdrop || {};
  const wallId = IDS.styles.includes(st.wallStyle) && st.wallStyle.startsWith('wall-') ? st.wallStyle : 'wall-white';
  const floorId = IDS.styles.includes(st.floorStyle) && st.floorStyle.startsWith('floor-') ? st.floorStyle : 'floor-lilac';
  let s = '';
  let wall = pack.styles?.[wallId];
  let floor = pack.styles?.[floorId];
  if (!wall) { s += missingBox(stackBox(miss), `style:${wallId}`); wall = FALLBACK_WALL; }
  if (!floor) { s += missingBox(stackBox(miss), `style:${floorId}`); floor = FALLBACK_FLOOR; }
  const corner = shade(floor.base, -22);
  const skirtHeight = 7; // source: components/pet/room/roomDecor.jsx:23
  s += `<polygon points="${pts([P(RU, 0, WH), P(0, 0, WH), P(0, 0, 0), P(RU, 0, 0)])}" fill="${wall.left}"/>`;
  s += `<polygon points="${pts([P(0, 0, WH), P(0, RV, WH), P(0, RV, 0), P(0, 0, 0)])}" fill="${wall.right}"/>`;
  s += part(bd.wallPattern, [wall], 'backdrop.wallPattern', miss);
  s += `<polygon points="${pts([P(0, 0), P(RU, 0), P(RU, RV), P(0, RV)])}" fill="${floor.base}"/>`;
  s += part(bd.floorPattern, [floor], 'backdrop.floorPattern', miss);
  s += `<polygon points="${pts([P(RU, 0, 0), P(0, 0, 0), P(0, 0, skirtHeight), P(RU, 0, skirtHeight)])}" fill="${wall.skirting}"/>`;
  s += `<polygon points="${pts([P(0, 0, 0), P(0, RV, 0), P(0, RV, skirtHeight), P(0, 0, skirtHeight)])}" fill="${shade(wall.skirting, -6)}"/>`;
  s += part(bd.skirting, [wall], 'backdrop.skirting', miss);
  s += `<polyline points="${pts([P(0, 0, 0), P(0, 0, WH)])}" fill="none" stroke="${shade(wall.left, -14)}" stroke-width="2.5" stroke-linecap="round"/>`;
  s += `<polyline points="${pts([P(RU, 0), P(0, 0), P(0, RV)])}" fill="none" stroke="${corner}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += part(bd.windowFrame, [st.night], 'backdrop.windowFrame', miss);
  s += part(bd.glass, [st.night], 'backdrop.glass', miss);
  s += part(bd.sky, [st.night], 'backdrop.sky', miss);
  s += part(bd.sill, [], 'backdrop.sill', miss);
  return s;
}

/* ---------- overlay: the live hit boxes ---------- */
function overlaySVG(st) {
  const levels = resolveRoomLevels(st.levels);
  let s = '<g class="overlay" fill="none" stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none">';
  for (const station of IDS.stations) {
    const [u, v, du, dv, h0, h1] = footprint3(station, levels[station]);
    const f = boxFaces(u, v, du, dv, h0, h1);
    s += `<g transform="${shiftTransform(GEOMETRY.STATION_SHIFT[station])}" stroke="#d81b60">`
      + `<polygon points="${pts(f.front)}"/><polygon points="${pts(f.side)}"/><polygon points="${pts(f.top)}"/></g>`;
  }
  for (const spot of DECOR_SPOTS) {
    const { corners, tag } = GEOMETRY.DECOR_SPOT_SHAPES[spot];
    s += `<polygon points="${pts(corners.map(c => P(...c)))}" stroke="#0288d1"/>`;
    const [x, y] = P(...tag);
    s += `<text x="${n1(x)}" y="${n1(y - 3)}" font-size="7" fill="#0277bd" stroke="none" text-anchor="middle" font-family="system-ui,sans-serif">${SPOT_LABELS[spot]}</text>`;
  }
  const { v0, v1, h0 } = GEOMETRY.WINDOW_GAP;
  s += `<polygon points="${pts([P(0, v0, h0), P(0, v1, h0), P(0, v1, GEOMETRY.ROOM_SIZE.h), P(0, v0, GEOMETRY.ROOM_SIZE.h)])}" stroke="#2e7d32"/>`;
  return s + '</g>';
}

/* ---------- the room ---------- */
function renderRoomSVG(pack, state, opts = {}) {
  const st = { ...defaultState(), ...state };
  const pk = st.herb ? HERB_REFERENCE : pack;
  if (st.herb) { st.wallStyle = 'wall-white'; st.floorStyle = 'floor-lilac'; st.placements = { ...defaultState().placements }; }
  ART_INK = pk.ink;
  const miss = { n: 0 };
  let s = backdropSVG(pk, st, miss);
  if (!opts.bare) {
    s += decorLayer(pk, st, 'rug') + decorLayer(pk, st, 'wall');
    for (const station of GEOMETRY.ROOM_DRAW_ORDER.filter(x => x !== 'bed')) s += stationGroup(pk, st, station, miss);
    s += decorLayer(pk, st, 'backFloor');
    s += stationGroup(pk, st, 'bed', miss);
    if (!st.sleeping && !st.herb) {
      const pose = st.cooking || st.served ? pipPose('cooker', 'happy', st.levels) : pipPose('rug', 'content', st.levels);
      s += creatureAt(pose, st.form);
    }
    s += decorLayer(pk, st, 'frontFloor');
    if (st.night) s += effectAt(pk.effects?.nightDim, [], 'effect:nightDim', [100, 150, 60]);
    if (st.overlay) s += overlaySVG(st);
  }
  const label = `${st.herb ? 'Herb room, simplified' : ROOM_NAME}${st.night ? ', night' : ', day'}`;
  return `<svg class="room-svg${opts.still ? ' is-still' : ''}" viewBox="${opts.viewBox || WORLD_VIEWBOX}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${s}</svg>`;
}

/* ---------- thumbnails: cropped with the live thumb boxes; the root carries .is-still so nothing animates ---------- */
const svgBox = b => `${n1(b.x)} ${n1(b.y)} ${n1(b.width)} ${n1(b.height)}`;
const thumbWrap = (b, inner) => `<svg class="is-still" viewBox="${svgBox(b)}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">${inner}</svg>`;
const STYLE_CROPS = { wall: { x: 60, y: 30, width: 240, height: 240 }, floor: { x: 108, y: 192, width: 180, height: 180 } };

function thumbSVG(pack, kind, id, level = 1) {
  ART_INK = pack.ink;
  if (kind === 'station') {
    const parts = stationParts(pack, id, level);
    return thumbWrap(stationThumbBox(id, level), parts ? parts.back + parts.front : missingBox(footBox(id, level), `${id}:L${level}`));
  }
  if (kind === 'decor') {
    const spot = SPOT_OF[id];
    return thumbWrap(decorThumbBox(spot), decorArtWorld(pack, id) ?? missingBox(spotBox(spot), `decor:${id}`));
  }
  const isWall = id.startsWith('wall-');
  const svg = renderRoomSVG(pack, { wallStyle: isWall ? id : 'wall-white', floorStyle: isWall ? 'floor-lilac' : id }, { bare: true, still: true, viewBox: svgBox(STYLE_CROPS[isWall ? 'wall' : 'floor']) });
  return svg.replace('role="img"', 'aria-hidden="true"').replace(/aria-label="[^"]*"/, '');
}

/** The station art with one effect on it, for the effects strip: kind = gauge | steam | zzz | servedPlate. */
function effectThumbSVG(pack, kind, level, pct) {
  ART_INK = pack.ink;
  const station = { gauge: 'fridge', steam: 'cooker', servedPlate: 'cooker', zzz: 'bed' }[kind];
  const parts = stationParts(pack, station, level);
  const anchorKey = { gauge: 'fridgeTop', steam: 'cookerPot', servedPlate: 'cookerPlate', zzz: 'bedTop' }[kind];
  const fn = pack.effects?.[kind];
  const args = kind === 'gauge' ? [level, pct] : [level];
  const fx = effectAt(fn, args, `effect:${kind}`, GEOMETRY.STATION_ANCHORS[anchorKey][level - 1]);
  return thumbWrap(stationThumbBox(station, level), (parts ? parts.back + parts.front : missingBox(footBox(station, level), `${station}:L${level}`)) + fx);
}

/* ---------- fit: the art's measured screen bounds against the live footprint / spot volume ---------- */
function fitRow(label, kind, boxText, box, art) {
  if (!art) return { id: label, kind, box: boxText, ok: false, missing: true, note: 'art missing' };
  const over = {
    left: box.x - art.x, top: box.y - art.y,
    right: art.x + art.width - (box.x + box.width), bottom: art.y + art.height - (box.y + box.height)
  };
  const bad = Object.entries(over).filter(([, v]) => v > FIT_TOLERANCE).map(([k, v]) => `${k} +${v.toFixed(1)}px`);
  return { id: label, kind, box: boxText, ok: bad.length === 0, missing: false, note: bad.join(', ') };
}

function fitReport(pack) {
  ART_INK = pack.ink;
  const rows = [];
  for (const station of IDS.stations) {
    for (let level = ROOM_MIN_LEVEL; level <= ROOM_MAX_LEVEL; level++) {
      const fp = footprint3(station, level);
      const art = pack.stations?.[station]?.[level - 1] ? measure(() => stationParts(pack, station, level)) : null;
      rows.push(fitRow(`${station} L${level}`, 'station', `[${fp.join(', ')}]`, boundsOf(boxCorners(...fp)), art));
    }
  }
  for (const [id, spot] of Object.entries(SPOT_OF)) {
    const vol = GEOMETRY.DECOR_SPOT_SHAPES[spot].volume;
    let art = pack.decor?.[id] ? measure(() => decorArtWorld(pack, id)) : null;
    if (art && LEGACY_SET.has(id)) { // the collector sees pre-shift coords; the live room slides legacy ids to their spot
      const [dx, dy] = shiftPx(GEOMETRY.DECOR_LEGACY_SHIFT[spot]);
      art = { ...art, x: art.x + dx, y: art.y + dy };
    }
    rows.push(fitRow(id, 'decor', `${spot} [${vol.join(', ')}]`, spotBox(spot), art));
  }
  return rows;
}
</script>
<script id="room-ui">
/* ======================================================================
   UI wiring only. Every control rewrites `state` and replaces the innerHTML of one container (no timers, no
   listeners on detached nodes). The thumbnail grids render once; the room, the effect previews and the toggle states re-render on input.
   ====================================================================== */
const PACK = ROBOT_ROOM;
const state = defaultState();
const ui = { thumb: 96 };
const app = document.getElementById('app');

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nameOf = (kind, id) => PACK.labels?.[kind]?.[id] || '';
const levelName = (station, level) => PACK.labels?.levels?.[station]?.[level - 1] || '';
const tog = (act, text, data = '') => `<button type="button" class="tog" aria-pressed="false" data-act="${act}" ${data}>${text}</button>`;
const fxOf = target => (PACK.ambience || []).filter(a => a.target === target).map(a => a.effect).join(', ');

/* ---------- page skeleton ---------- */
function skeleton() {
  const stationBlocks = IDS.stations.map(station => `
    <div class="station" data-station="${station}">
      <div class="head"><h3>${esc(HERB_LABELS.stations[station])}${nameOf('stations', station) ? ` &rarr; ${esc(nameOf('stations', station))}` : ' &rarr; <span class="todo">unnamed</span>'}</h3>
        <span class="note">${[1, 2, 3, 4].map(l => `L${l} <b>${levelName(station, l) ? esc(levelName(station, l)) : '<span class="todo">unnamed</span>'}</b> (herb: ${esc(HERB_LABELS.levels[station][l - 1])})`).join(' &middot; ')}</span></div>
      <div class="levels">${[1, 2, 3, 4].map(l => `<button type="button" class="lvl" aria-pressed="false" data-act="level" data-s="${station}" data-v="${l}" aria-label="${esc(HERB_LABELS.stations[station])} level ${l}">${thumbSVG(PACK, 'station', station, l)}<span>L${l}</span><small><b>${esc(levelName(station, l))}</b><br>${esc(HERB_LABELS.levels[station][l - 1])}</small></button>`).join('')}</div>
    </div>`).join('');

  const spotPickers = DECOR_SPOTS.map(spot => {
    const ids = Object.keys(SPOT_OF).filter(id => SPOT_OF[id] === spot);
    const options = (spot === 'rug' ? '' : '<option value="">Empty</option>')
      + ids.map(id => `<option value="${id}">${esc(nameOf('decor', id) || id)}</option>`).join('');
    return `<label class="sel">${esc(SPOT_LABELS[spot])}<select data-spot="${spot}" aria-label="${esc(SPOT_LABELS[spot])}">${options}</select></label>`;
  }).join('');

  const decorCells = Object.keys(SPOT_OF).map(id => `<button type="button" class="cell" aria-pressed="false" data-act="place" data-id="${id}" aria-label="${esc(nameOf('decor', id) || id)}">${thumbSVG(PACK, 'decor', id)}<span>${esc(nameOf('decor', id) || id)}</span><small>${esc(HERB_LABELS.decor[id])}</small></button>`).join('');

  const styleChips = (prefix, act) => IDS.styles.filter(id => id.startsWith(prefix)).map(id => `<button type="button" class="chip" aria-pressed="false" data-act="${act}" data-v="${id}" aria-label="${esc(nameOf('styles', id) || id)}">${thumbSVG(PACK, 'style', id)}<span>${esc(nameOf('styles', id) || id)}</span><small class="note">${esc(HERB_LABELS.styles[id])}</small></button>`).join('');

  app.innerHTML = `
    <h1>Pip room: ${esc(ROOM_NAME)}</h1>
    <p class="lede">The live isometric room rebuilt from the app's real geometry (a <code>GEOMETRY</code> table copied from the live code), drawn as <b>${esc(ROOM_NAME)}</b>. Stations keep their jobs and levels, every decor id and style keeps its spot, and the camera, footprints and Pip's poses are unchanged. Turn on <b>Hit boxes</b> to see the live tap areas the art has to fit. Names are proposals for red-lining.</p>

    <h2>1 &middot; Controls</h2>
    <div class="bar">
      <div class="group" role="group" aria-label="Scene"><b>Scene</b>${tog('night', 'Night')}${tog('herb', 'Herb reference')}${tog('overlay', 'Hit boxes')}</div>
      <div class="group" role="group" aria-label="Motion"><b>Motion</b>${tog('lowfx', 'Low FX')}${tog('reduced', 'Reduced motion')}</div>
      <div class="group" role="group" aria-label="Creature form"><b>Creature</b>${[1, 2, 3].map(f => tog('form', `${f} &middot; ${ROBOT_FORMS[f - 1].name}`, `data-v="${f}"`)).join('')}</div>
      <div class="group" role="group" aria-label="Thumbnail size"><b>Crop size</b>${tog('thumb', 'Shop 96 px', 'data-v="96"')}${tog('thumb', 'Picker 56 px', 'data-v="56"')}</div>
    </div>

    <div class="bench">
      <div class="stagecol">
        <h2 style="margin-top:0">2 &middot; The room</h2>
        <div class="stage" id="room"></div>
        <p class="herbnote" id="herbnote" hidden>Herb room (simplified). Live reference: /pet on Default.</p>
        <p class="status" id="status" role="status"></p>
      </div>
      <div>
        <h2 style="margin-top:0">3 &middot; Walls and floors</h2>
        <h3>Walls</h3><div class="chips" role="group" aria-label="Wall style">${styleChips('wall-', 'wall')}</div>
        <h3 style="margin-top:12px">Floors</h3><div class="chips" role="group" aria-label="Floor style">${styleChips('floor-', 'floor')}</div>

        <h2>4 &middot; Stations (levels 1 to 4)</h2>
        ${stationBlocks}

        <h2>5 &middot; Decor (12 spots, 55 items)</h2>
        <div class="spots">${spotPickers}</div>
        <div class="decorgrid" role="group" aria-label="All decor">${decorCells}</div>

        <h2>6 &middot; Effects and ambience</h2>
        <div class="bar">
          <div class="group" role="group" aria-label="Pose and effects"><b>Pose</b>${tog('sleeping', 'Sleeping')}${tog('cooking', 'Cooking')}${tog('served', 'Served plate')}</div>
          <div class="group" role="group" aria-label="Fridge gauge"><b>Fridge</b>${[0, 50, 100].map(p => tog('pct', `${p} %`, `data-v="${p}"`)).join('')}</div>
        </div>
        <div class="fxs" id="fxs"></div>
        <div class="tablewrap" style="margin-top:10px"><table id="ambience"></table></div>
      </div>
    </div>

    <h2>7 &middot; Names (90 rows: 5 stations, 20 levels, 55 decor, 10 styles; id, spot, herb label, ${esc(ROOM_NAME.toLowerCase())} label, fx)</h2>
    <div class="card tablewrap"><table id="names"></table></div>

    <h2>8 &middot; Fit against the live footprints</h2>
    <p class="lede">Every row is the drawn art's measured bounds against the live footprint (stations, in their own art coords) or the spot volume (decor, in world coords), with ${FIT_TOLERANCE} px tolerance for the outline stroke. The hit-box overlay is the visual check.</p>
    <div class="card tablewrap"><table id="fit"></table></div>`;

  const first = DECOR_SPOTS.map(spot => spot);
  first.forEach(spot => { const sel = app.querySelector(`select[data-spot="${spot}"]`); sel.value = state.placements[spot] || ''; });
}

/* ---------- tables, built once ---------- */
function buildTables() {
  const rows = [];
  for (const station of IDS.stations) rows.push(['station', station, '-', HERB_LABELS.stations[station], nameOf('stations', station), fxOf(station)]);
  for (const station of IDS.stations) for (let l = 1; l <= 4; l++) rows.push(['level', `${station} L${l}`, '-', HERB_LABELS.levels[station][l - 1], levelName(station, l), '']);
  for (const id of IDS.styles) rows.push(['style', id, id.startsWith('wall-') ? 'Walls' : 'Floor', HERB_LABELS.styles[id], nameOf('styles', id), '']);
  for (const [id, spot] of Object.entries(SPOT_OF)) rows.push(['decor', id, SPOT_LABELS[spot], HERB_LABELS.decor[id], nameOf('decor', id), fxOf(id)]);
  document.getElementById('names').innerHTML = `<thead><tr><th>Kind</th><th>Id</th><th>Spot</th><th>Herb label</th><th>${esc(ROOM_NAME)} label</th><th>fx</th></tr></thead><tbody>`
    + rows.map(r => `<tr><td>${r[0]}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${r[4] ? `<b>${esc(r[4])}</b>` : '<span class="todo">not named yet</span>'}</td><td>${esc(r[5])}</td></tr>`).join('') + '</tbody>';

  document.getElementById('ambience').innerHTML = '<thead><tr><th>Ambience target</th><th>Effect</th></tr></thead><tbody>'
    + ((PACK.ambience || []).length ? PACK.ambience.map(a => `<tr><td>${esc(a.target)}</td><td>${esc(a.effect)}</td></tr>`).join('') : '<tr><td colspan="2" class="todo">none yet</td></tr>') + '</tbody>';

  const fit = fitReport(PACK);
  const stations = fit.filter(r => r.kind === 'station'), decor = fit.filter(r => r.kind === 'decor');
  const summary = (list) => `${list.filter(r => r.ok).length} of ${list.length} fit` + (list.some(r => r.missing) ? `, ${list.filter(r => r.missing).length} not drawn yet` : '');
  document.getElementById('fit').innerHTML = `<thead><tr><th>Item</th><th>Box (live)</th><th>Fits</th></tr></thead><tbody>`
    + `<tr><td colspan="3"><b>Stations: ${summary(stations)}. Decor: ${summary(decor)}.</b></td></tr>`
    + fit.map(r => `<tr><td>${esc(r.id)}</td><td><code>${esc(r.box)}</code></td><td>${r.missing ? '<span class="todo">not drawn yet</span>' : r.ok ? '<span class="pass">&check;</span>' : `<span class="fail">${esc(r.note)}</span>`}</td></tr>`).join('') + '</tbody>';
}

/* ---------- re-rendered on input ---------- */
function renderEffects() {
  const lv = resolveRoomLevels(state.levels);
  const items = [
    ...[0, 50, 100].map(p => [`Gauge ${p} %`, effectThumbSVG(PACK, 'gauge', lv.fridge, p)]),
    ['Steam', effectThumbSVG(PACK, 'steam', lv.cooker)],
    ['Zzz', effectThumbSVG(PACK, 'zzz', lv.bed)],
    ['Served plate', effectThumbSVG(PACK, 'servedPlate', lv.cooker)]
  ];
  document.getElementById('fxs').innerHTML = items.map(([text, svg]) => `<figure>${svg}${esc(text)}</figure>`).join('')
    + `<figure>${renderRoomSVG(PACK, { night: true, levels: state.levels }, { still: true })}Night dim</figure>`;
}

function isOn(b) {
  const d = b.dataset;
  switch (d.act) {
    case 'night': return state.night;
    case 'herb': return state.herb;
    case 'overlay': return state.overlay;
    case 'lowfx': return document.body.classList.contains('lowfx');
    case 'reduced': return document.body.classList.contains('reduced');
    case 'sleeping': return state.sleeping;
    case 'cooking': return state.cooking;
    case 'served': return state.served;
    case 'form': return state.form === Number(d.v);
    case 'pct': return state.fridgePct === Number(d.v);
    case 'thumb': return ui.thumb === Number(d.v);
    case 'wall': return state.wallStyle === d.v;
    case 'floor': return state.floorStyle === d.v;
    case 'level': return state.levels[d.s] === Number(d.v);
    case 'place': return state.placements[SPOT_OF[d.id]] === d.id;
    default: return false;
  }
}

function render() {
  const html = renderRoomSVG(PACK, state);
  document.getElementById('room').innerHTML = html;
  const missing = [...new Set([...html.matchAll(/>missing: ([^<]+)</g)].map(m => m[1]))];
  document.getElementById('status').innerHTML = missing.length
    ? `<span class="fail">Missing art in this view (${missing.length}):</span> ${esc(missing.join(', '))}`
    : 'No missing art in this view.';
  document.getElementById('herbnote').hidden = !state.herb;
  app.querySelectorAll('button[data-act]').forEach(b => b.setAttribute('aria-pressed', String(isOn(b))));
  document.documentElement.style.setProperty('--thumb', `${ui.thumb}px`);
  renderEffects();
}

app.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'night': state.night = !state.night; break;
    case 'herb': state.herb = !state.herb; break;
    case 'overlay': state.overlay = !state.overlay; break;
    case 'lowfx': document.body.classList.toggle('lowfx'); break;
    case 'reduced': document.body.classList.toggle('reduced'); break;
    case 'sleeping': state.sleeping = !state.sleeping; if (state.sleeping) { state.cooking = false; state.served = false; } break;
    case 'cooking': state.cooking = !state.cooking; if (state.cooking) state.sleeping = false; break;
    case 'served': state.served = !state.served; if (state.served) state.sleeping = false; break;
    case 'form': state.form = Number(d.v); break;
    case 'pct': state.fridgePct = Number(d.v); break;
    case 'thumb': ui.thumb = Number(d.v); break;
    case 'wall': state.wallStyle = d.v; break;
    case 'floor': state.floorStyle = d.v; break;
    case 'level': state.levels[d.s] = Number(d.v); break;
    case 'place': {
      const spot = SPOT_OF[d.id];
      state.placements[spot] = d.id;
      app.querySelector(`select[data-spot="${spot}"]`).value = d.id;
      break;
    }
    default: return;
  }
  render();
});

app.addEventListener('change', e => {
  const sel = e.target.closest('select[data-spot]');
  if (!sel) return;
  state.placements[sel.dataset.spot] = sel.value || null;
  render();
});

/* ---------- deep links: #night&overlay&herb&sleeping&cooking&served&lowfx&reduced, #form=2&pct=0&wall=wall-mint&floor=floor-oak, #bed=3 (a station level), #rug=rug-braided (a spot) ---------- */
function applyHash() {
  for (const token of location.hash.slice(1).split('&').filter(Boolean)) {
    const [key, value] = token.split('=');
    if (value === undefined) {
      if (key === 'lowfx' || key === 'reduced') document.body.classList.add(key);
      else if (['night', 'overlay', 'herb', 'sleeping', 'cooking', 'served'].includes(key)) state[key] = true;
    } else if (key in state.levels) state.levels[key] = Number(value);
    else if (key in state.placements) state.placements[key] = value || null;
    else if (key === 'wall') state.wallStyle = value;
    else if (key === 'floor') state.floorStyle = value;
    else if (key === 'form') state.form = Number(value);
    else if (key === 'pct') state.fridgePct = Number(value);
  }
}

applyHash();
skeleton();
buildTables();
render();
</script>
</body>
</html>
