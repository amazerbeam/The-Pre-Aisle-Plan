<!-- Contract: .claude/contract/2026-11-16-themed-pip-rooms-mockups/ (Phase 1). Mockup only: nothing under client/src changes until the developer approves it. -->
<style>
  :root {
    --brand: #4a3f80; --text: #2c3e50; --muted: #5f6b76;
    --bg: #f3f5f0; --card: #ffffff; --line: #e1e6dc; --ok: #2f7d32; --bad: #c62828;
    --thumb: 96px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 14px 64px; }
  h1 { color: var(--brand); margin: 0 0 4px; font-size: 1.6rem; }
  h2 { color: var(--brand); margin: 32px 0 10px; font-size: 1.2rem; }
  h3 { margin: 0 0 8px; font-size: 1rem; }
  .lede { color: var(--muted); margin: 0 0 14px; max-width: 880px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 4px 18px rgba(40,60,30,.08); }
  .note { font-size: .85rem; color: var(--muted); }
  button, select { font: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 0 0 12px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > b { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  .tog, .btn { min-width: 44px; min-height: 44px; border: 1px solid #c9d2c0; background: #fff; color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: .88rem; font-weight: 600; cursor: pointer; }
  .tog[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .tog:focus-visible, .btn:focus-visible, select:focus-visible, .cell:focus-visible { outline: 3px solid #f0a000; outline-offset: 2px; }
  @media (hover: hover) { .tog:hover:not([aria-pressed="true"]) { background: #eef1ea; } }
  select { min-height: 44px; border: 1px solid #c9d2c0; border-radius: 10px; padding: 6px 10px; background: #fff; max-width: 100%; }
  label.sel { display: flex; flex-direction: column; gap: 2px; font-size: .78rem; font-weight: 700; color: var(--muted); }
  label.sel select { font-weight: 500; color: var(--text); font-size: .9rem; }

  /* ---- workbench: the room stays in view on wide screens ---- */
  .bench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
  .stagecol { position: static; }
  .stage { border-radius: 16px; overflow: hidden; position: relative; background: #ecebf3; box-shadow: 0 4px 18px rgba(40,60,30,.12); }
  .stage .room-svg { display: block; width: 100%; height: auto; }
  .status { font-size: .82rem; margin: 8px 2px 0; color: var(--muted); }
  .status .fail { color: var(--bad); font-weight: 700; }
  .herbnote { margin: 8px 2px 0; font-size: .85rem; font-weight: 700; color: var(--brand); }
  @media (min-width: 1000px) {
    .bench { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
    .stagecol { position: sticky; top: 12px; }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; padding: 6px 4px; border-radius: 12px; border: 2px solid transparent; background: #f7f9f4; cursor: pointer; font-size: .74rem; font-weight: 700; color: var(--text); min-height: 44px; }
  .chip[aria-pressed="true"] { border-color: var(--brand); background: #eceaf8; }
  .chip svg { width: 76px; height: 76px; display: block; }

  .station { margin-bottom: 14px; padding: 10px; background: #f8faf6; border-radius: 14px; }
  .station .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 8px; }
  .levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .lvl { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border-radius: 10px; border: 2px solid transparent; background: #fff; cursor: pointer; font-size: .68rem; font-weight: 700; min-height: 44px; color: var(--text); }
  .lvl[aria-pressed="true"] { border-color: var(--brand); }
  .lvl svg, .cell svg { width: var(--thumb); max-width: 100%; height: auto; aspect-ratio: 1; display: block; background: #f1f1f6; border-radius: 8px; }
  .lvl small { font-weight: 500; color: var(--muted); text-align: center; line-height: 1.15; }

  .spots { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; margin-bottom: 14px; }
  .decorgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--thumb) + 14px), 1fr)); gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px; border-radius: 12px; border: 2px solid transparent; background: #f7f9f4; cursor: pointer; font-size: .7rem; font-weight: 700; text-align: center; line-height: 1.15; color: var(--text); min-height: 44px; }
  .cell[aria-pressed="true"] { border-color: var(--brand); background: #eceaf8; }
  .cell small { font-weight: 500; color: var(--muted); }
  .fxs { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--thumb) + 18px), 1fr)); gap: 8px; margin-top: 8px; }
  .fxs figure { margin: 0; text-align: center; font-size: .72rem; font-weight: 700; background: #f7f9f4; border-radius: 12px; padding: 6px; }
  .fxs svg { width: var(--thumb); max-width: 100%; height: auto; aspect-ratio: 1; display: block; margin: 0 auto 2px; background: #f1f1f6; border-radius: 8px; }

  table { border-collapse: collapse; width: 100%; font-size: .8rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #fff; }
  .tablewrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .pass { color: var(--ok); font-weight: 700; }
  .fail { color: var(--bad); font-weight: 700; }
  .todo { color: var(--muted); }

  /* ---- room effects and ambience: CSS only, transform + opacity, stopped by Low FX, reduced motion and thumbnails ---- */
  .room-fx { transform-box: fill-box; transform-origin: center; }
  .room-fx--steam { animation: room-steam 1.2s ease-in-out infinite; }
  .room-fx--zzz { animation: room-zzz 2.4s ease-in-out infinite; }
  @keyframes room-steam { 0% { opacity: .2; transform: translateY(2px); } 50% { opacity: 1; } 100% { opacity: .2; transform: translateY(-6px); } }
  @keyframes room-zzz { 0%, 100% { opacity: .55; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }
  .room-fx--flicker { transform-origin: 50% 100%; animation: room-flicker 1.7s ease-in-out infinite; }
  .room-fx--embers { animation: room-embers 2.4s ease-out infinite; }
  .room-fx--glint { animation: room-glint 2.8s ease-in-out infinite; }
  .room-fx--sway { transform-origin: 50% 0; animation: room-sway 4.2s ease-in-out infinite; }
  @keyframes room-flicker { 0%, 100% { opacity: 1; transform: scale(1, 1); } 30% { opacity: .8; transform: scale(.94, 1.07); } 55% { opacity: .95; transform: scale(1.05, .95); } 78% { opacity: .75; transform: scale(.96, 1.05); } }
  @keyframes room-embers { 0% { opacity: 0; transform: translateY(3px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  @keyframes room-glint { 0%, 55%, 100% { opacity: .3; transform: scale(.8); } 72% { opacity: 1; transform: scale(1.15); } }
  @keyframes room-sway { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }
  body.lowfx .room-fx, body.reduced .room-fx, .is-still .room-fx { animation: none !important; }
  body.lowfx [data-glow] { filter: none !important; }
  @media (prefers-reduced-motion: reduce) { .room-fx { animation: none !important; } }
</style>

/* ---- geometry helpers, bodies copied from roomLayout.js (P comes from the iso block) ---- */
function shiftPx([du, dv, dh = 0]) {
  const [x0, y0] = P(0, 0, 0);
  const [x, y] = P(du, dv, dh);
  return [x - x0, y - y0];
} // source: components/pet/room/roomLayout.js:65-69

  const [dx, dy] = shiftPx(shift);

  const corners = [];

<script id="room-iso">
/* ======================================================================
   Iso helpers. P / pts / shade / boxFaces / ellipsePoints / cylinderSidePoints and the flat-rectangle points are
   iso.js, logic unchanged (ES exports -> plain functions). Floor coords: u along the LEFT wall (plane v = 0), v along the
   RIGHT wall (plane u = 0), h up; the viewer is at +u, +v. Below them: the shape helpers (isoShapes.jsx) as SVG-string
   functions, plus a bounds collector the fit table and the smoke use to measure the art against the live footprints.
   ====================================================================== */
const ISO_N = Math.hypot(180, 70);
const ISO_C = 180 / ISO_N;
const ISO_S = 70 / ISO_N;

/** Floor point (u, v) at height h -> SVG [x, y]. */
function P(u, v, h = 0) {
  return [180 - u * ISO_C + v * ISO_C, 180 + (u + v) * ISO_S - h];
}

/** [[x, y], ...] -> an SVG `points` string, one decimal place. */
function pts(points) {
  return points.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
}

/** Lighten (pct > 0) or darken (pct < 0) a '#rrggbb' colour. */
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const f = pct / 100;
  const channel = s => {
    const c = (n >> s) & 255;
    return Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f));
  };
  return `rgb(${channel(16)},${channel(8)},${channel(0)})`;
}

/** Like shade, but returns a '#rrggbb' hex (so the result can be shaded again). */
function tint(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const f = pct / 100;
  const channel = s => {
    const c = (n >> s) & 255;
    return Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f));
  };
  return '#' + [16, 8, 0].map(s => channel(s).toString(16).padStart(2, '0')).join('');
}

/** The three visible faces of a solid box, in draw order: front (u = u+du), side (v = v+dv), top. */
function boxFaces(u, v, du, dv, h0, h1) {
  const U = u + du;
  const V = v + dv;
  return {
    front: [P(U, v, h0), P(U, V, h0), P(U, V, h1), P(U, v, h1)],
    side: [P(u, V, h0), P(U, V, h0), P(U, V, h1), P(u, V, h1)],
    top: [P(u, v, h1), P(U, v, h1), P(U, V, h1), P(u, V, h1)]
  };
}

function rectVPoints(vp, u0, u1, h0, h1) {
  return [P(u0, vp, h0), P(u1, vp, h0), P(u1, vp, h1), P(u0, vp, h1)];
}

function rectUPoints(up, v0, v1, h0, h1) {
  return [P(up, v0, h0), P(up, v1, h0), P(up, v1, h1), P(up, v0, h1)];
}

function rectHPoints(h, u0, u1, v0, v1) {
  return [P(u0, v0, h), P(u1, v0, h), P(u1, v1, h), P(u0, v1, h)];
}

function ellipsePoints(cu, cv, h, ru, rv, steps = 24) {
  const points = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    points.push(P(cu + ru * Math.cos(t), cv + rv * Math.sin(t), h));
  }
  return points;
}

function cylinderSidePoints(cu, cv, r, h0, h1) {
  const angle = i => -Math.PI / 4 + (i / 12) * Math.PI;
  const points = [];
  for (let i = 0; i <= 12; i++) points.push(P(cu + r * Math.cos(angle(i)), cv + r * Math.sin(angle(i)), h0));
  for (let i = 12; i >= 0; i--) points.push(P(cu + r * Math.cos(angle(i)), cv + r * Math.sin(angle(i)), h1));
  return points;
}

/* ---------- bounds collector: every shape helper reports the points it draws ---------- */
let ART_INK = '#2b2630'; // the room's outline colour; the engine sets it from pack.ink before each draw
let _bounds = null;

function track(points) {
  if (!_bounds) return;
  for (const [x, y] of points) {
    if (x < _bounds.x0) _bounds.x0 = x;
    if (y < _bounds.y0) _bounds.y0 = y;
    if (x > _bounds.x1) _bounds.x1 = x;
    if (y > _bounds.y1) _bounds.y1 = y;
  }
}

/** Run fn (which draws) and return the screen bounds {x, y, width, height} of everything it drew, or null if nothing. */
function measure(fn) {
  const previous = _bounds;
  const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  _bounds = b;
  try { fn(); } finally { _bounds = previous; }
  return b.x0 === Infinity ? null : { x: b.x0, y: b.y0, width: b.x1 - b.x0, height: b.y1 - b.y0 };

/* ---------- shape helpers: SVG strings, outline ART_INK, shading as the live Box (-6 front, -20 side, +14 top) ---------- */
const n1 = n => n.toFixed(1);

  return `<polyline points="${pts(points)}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}${o.op != null ? ` opacity="${o.op}"` : ''}/>`;
}

/** Solid box: the two visible sides, then the top. */
function box(u, v, du, dv, h0, h1, color, o = {}) {
  const f = boxFaces(u, v, du, dv, h0, h1);
  return poly(f.front, shade(color, -6), o) + poly(f.side, shade(color, -20), o) + poly(f.top, shade(color, 14), o);
}

function rectU(up, v0, v1, h0, h1, fill, o) { return poly(rectUPoints(up, v0, v1, h0, h1), fill, o); }

/** Points along an ellipse from angle t0 to t1 (radians) at height h. */
function arcPts(cu, cv, h, ru, rv, t0, t1, n = 14) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = t0 + ((t1 - t0) * i) / n;
    out.push(P(cu + ru * Math.cos(t), cv + rv * Math.sin(t), h));
  }
  return out;
}

/** The near (viewer-facing) half of a floor ellipse as an angle range, [t0, t1]. */
function nearRange(ru, rv) {
  const t0 = Math.atan2(-rv, ru);
  return [t0, t0 + Math.PI];
}

/** Short cylinder / drum, optionally tapered: the near side band, then the top ellipse. */
function cylE(cu, cv, ru, rv, h0, h1, color, ru1 = ru, rv1 = rv, o = {}) {
  const [t0, t1] = nearRange(ru, rv);
  const band = [...arcPts(cu, cv, h0, ru, rv, t0, t1), ...arcPts(cu, cv, h1, ru1, rv1, t0, t1).reverse()];
  return poly(band, shade(color, -12), o) + poly(ellipsePoints(cu, cv, h1, ru1, rv1), shade(color, 12), o);
}
function cyl(cu, cv, r, h0, h1, color, o) { return cylE(cu, cv, r, r, h0, h1, color, r, r, o); }

/** Billboard: flat art pinned to a floor point. ext = the art's extent [x0, y0, x1, y1] around that point, for the bounds. */
function bill(u, v, h, inner, ext = [-8, -16, 8, 2]) {
  const [x, y] = P(u, v, h);
  track([[x + ext[0], y + ext[1]], [x + ext[2], y + ext[3]]]);
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${inner}</g>`;
}

/** An animated group. The class never sits on a group that carries a transform (position goes on an outer <g>). */
function fxg(effect, inner, delay = 0) {
  return `<g class="room-fx room-fx--${effect}"${delay ? ` style="animation-delay:-${delay}s"` : ''}>${inner}</g>`;
}

/** Several line segments [[p, q], ...] as one <path>, all tracked for the bounds. */
function isoLines(segs, width = 1, color = ART_INK, op) {
  if (!segs.length) return '';
  let d = '';
  for (const [a, b] of segs) {
    track([a, b]);
    d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
  }
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round"${op != null ? ` opacity="${op}"` : ''}/>`;
}

/** A glow: CSS drop-shadow on the element. Removed under Low FX by `.lowfx [data-glow]`. */
function glowAttr(color, radius = 3) {
  return `data-glow style="filter:drop-shadow(0 0 ${radius}px ${color})"`;
}

  d += `<ellipse cx="100" cy="${ey + 14 * s}" rx="${gap + 8 * s}" ry="${10 * s}" fill="#fff" opacity=".32"/>`;
  d += `<circle cx="${100 - 4 * s}" cy="${ey + 9 * s}" r="${1.7 * s}" fill="${DRAGON_INK}"/><circle cx="${100 + 4 * s}" cy="${ey + 9 * s}" r="${1.7 * s}" fill="${DRAGON_INK}"/>`;
  if (fi >= 1) d += `<ellipse cx="${100 - gap * 0.9}" cy="${f.hat.y + 4}" rx="4" ry="2.6" fill="${f.fill[1]}" opacity=".5"/><ellipse cx="${100 + gap * 0.9}" cy="${f.hat.y + 4}" rx="4" ry="2.6" fill="${f.fill[1]}" opacity=".5"/>`;
  return d;
}
function dragonHorn(x, base, h, dir) {
  return `<path d="M${x - 5} ${base + 6} Q${x - 3 + dir * 2} ${base - h * 0.6} ${x + dir * 7} ${base - h} Q${x + 4 + dir * 2} ${base - h * 0.45} ${x + 6} ${base + 6} Z" fill="${DR.horn}" stroke="${DRAGON_INK}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M${x - 2} ${base} q${dir * 3} -2 ${dir * 6} -1 M${x - 1} ${base - h * 0.3} q${dir * 3} -2 ${dir * 5} -1" stroke="${DRAGON_INK}" stroke-width="1.4" opacity=".4" fill="none"/>`;
}
function dragonCrown(fi, droop, base) {
  if (fi === 0) {
    let zig = `M84 ${base + 4}`;
    for (let i = 1; i <= 8; i++) zig += ` L${84 + i * 4} ${i % 2 ? base - 1 : base + 4}`;
    return `<g transform="rotate(${droop ? -20 : -8} 100 ${base})"><path d="${zig} C116 ${base - 16} 84 ${base - 16} 84 ${base + 4}Z" fill="${DR.shell}" stroke="${DRAGON_INK}" stroke-width="2.8" stroke-linejoin="round"/><ellipse cx="96" cy="${base - 4}" rx="3" ry="2" fill="${DR.shellSpot}"/></g>`;
  }
  if (fi === 1) return dragonHorn(85, base, 18, -1) + dragonHorn(115, base, 18, 1);
  return `<path d="M95 ${base + 6} L100 ${base - 10} L105 ${base + 6} Z" fill="${DR.horn}" stroke="${DRAGON_INK}" stroke-width="2.6" stroke-linejoin="round"/>` + dragonHorn(82, base, 26, -1) + dragonHorn(118, base, 26, 1);
}
function dragonFace(f, mood) {
  const { y: ey, gap, s } = f.eyes, ink = DRAGON_INK, L = 100 - gap, R = 100 + gap, my = ey + 17 * s;
  const fang = `<path d="M${100 + 3 * s} ${my + 1 * s} l${2.5 * s} ${5 * s} l${2.5 * s} ${-5 * s} Z" fill="#fff" stroke="${ink}" stroke-width="${1.6 * s}" stroke-linejoin="round"/>`;
  if (mood === 'content' || mood === 'mischievous') {
    const dx = mood === 'mischievous' ? 3 * s : 0;
    const st = `stroke="${ink}" stroke-width="${4 * s}" stroke-linecap="round" fill="none"`;
    const eye = (x) => `<ellipse cx="${x + dx}" cy="${ey}" rx="${7.5 * s}" ry="${9.5 * s}" fill="${DR.iris}" stroke="${ink}" stroke-width="${2.6 * s}"/><ellipse cx="${x + dx}" cy="${ey + 0.5 * s}" rx="${2.6 * s}" ry="${7 * s}" fill="${ink}"/><circle cx="${x + dx + 2.6 * s}" cy="${ey - 4 * s}" r="${2.2 * s}" fill="#fff"/>`;
    const brows = mood === 'mischievous' ? `<path d="M${L - 10 * s} ${ey - 13 * s} Q${L} ${ey - 15 * s} ${L + 10 * s} ${ey - 20 * s}" ${st}/><path d="M${R - 10 * s} ${ey - 20 * s} Q${R} ${ey - 15 * s} ${R + 10 * s} ${ey - 13 * s}" ${st}/>` : '';
    const mouth = mood === 'mischievous'
      ? `<path d="M${100 - 11 * s} ${my} Q${100 - 3 * s} ${my + 8 * s} ${100 + 3 * s} ${my + 1 * s} Q${100 + 8 * s} ${my - 3 * s} ${100 + 13 * s} ${my + 2 * s}" ${st}/>`
      : `<path d="M${100 - 9 * s} ${my - 2 * s} Q100 ${my + 6 * s} ${100 + 9 * s} ${my - 2 * s}" ${st}/>`;
    const blush = `<ellipse cx="${L - 11 * s}" cy="${ey + 11 * s}" rx="${8 * s}" ry="${4.5 * s}" fill="#ff8fab" opacity=".45"/><ellipse cx="${R + 11 * s}" cy="${ey + 11 * s}" rx="${8 * s}" ry="${4.5 * s}" fill="#ff8fab" opacity=".45"/>`;
    return eye(L) + eye(R) + brows + mouth + fang + blush;
  }
  return face(100, ey, gap, mood, s, ink) + (mood === 'happy' ? fang : '');
}

/* ======================================================================
   The creature in the room: the dragon with no outfit, composed in pipFigure's layer order with the wardrobe layers empty.
   Returned in the 200-unit Pip space, feet on (100, 186). Form 1-3 = Hatchling / Wyrmling / Drake.
   ====================================================================== */
let _creatureUid = 0;
function creatureSVG(form, mood) {
  const fi = Math.min(Math.max(Math.round(form), 1), DRAGON_FORMS.length) - 1;
  const f = DRAGON_FORMS[fi], id = `cr${_creatureUid++}`, droop = mood === 'bored' || mood === 'sleep';
  let s = `<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${f.fill[0]}"/><stop offset="1" stop-color="${f.fill[1]}"/></linearGradient></defs>`;
  s += dragonBack(fi, droop, f);
  s += dragonLimbs(f, fi);
  s += `<path d="${f.body}" fill="url(#${id}g)"/>`;
  s += `<ellipse cx="${100 - f.side * 0.55}" cy="${f.hat.y + 10}" rx="11" ry="6" transform="rotate(-32 ${100 - f.side * 0.55} ${f.hat.y + 10})" fill="#fff" opacity=".45"/>`;
  s += dragonDetails(f, fi);
  s += `<path d="${f.body}" fill="none" stroke="${DRAGON_INK}" stroke-width="5" stroke-linejoin="round"/>`;
  s += dragonFace(f, mood);
  s += dragonCrown(fi, droop, f.growTop);
  const k = f.scale;
  return `<ellipse cx="100" cy="189" rx="${56 * k}" ry="6" fill="rgba(40,60,20,.13)"/><g transform="translate(100 186) scale(${k}) translate(-100 -186)">${s}</g>`;
}

<script id="room-pack">
/* ======================================================================
   DRAGON_ROOM: the planned room-pack shape contract 2 ports verbatim (plan.md -> Data shapes).
   { ink, styles, backdrop, stations, decor, effects, ambience, labels }. Every drawing is an anchor-driven function
   returning an SVG string in the live coords: stations in their own (unshifted) art coords inside GEOMETRY.FOOTPRINT,
   decor in world coords inside its spot volume (the 12 legacy ids in MPP-27 coords, slid by DECOR_LEGACY_SHIFT), the
   window in world coords inside GEOMETRY.WINDOW_GAP. The bed returns { back, front } so a sleeping creature sits between.
   Animated parts are wrapped in fxg(effect, ...) = class="room-fx room-fx--<effect>"; the class never sits on a transformed group.
   ====================================================================== */
const ROOM_NAME = 'Dragon lair';

/* ---------- drawing helpers for this pack (no DOM) ---------- */
const rnd = seed => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const fmt = n => n.toFixed(1);
const gaugeColour = pct => (pct > GEOMETRY.FRIDGE_PLENTY_PCT ? GEOMETRY.FRIDGE_GAUGE_COLOURS.high : pct > GEOMETRY.FRIDGE_LOW_PCT ? GEOMETRY.FRIDGE_GAUGE_COLOURS.mid : GEOMETRY.FRIDGE_GAUGE_COLOURS.low);

/* A wall plane as a function (along, height) -> screen point. */
const wallAt = plane => (a, h) => (plane === 'left' ? P(a, 0, h) : P(0, a, h));
const wallLen = plane => (plane === 'left' ? GEOMETRY.ROOM_SIZE.u : GEOMETRY.ROOM_SIZE.v);

/** Hewn-stone courses on one wall: tinted blocks, then mortar joints (staggered), as a few elements. */
function stoneCourses(plane, w) {
  const at = wallAt(plane), len = wallLen(plane), r = rnd(plane === 'left' ? 11 : 23);
  const ROW = 15, ROWS = GEOMETRY.ROOM_SIZE.h / ROW;
  const base = plane === 'left' ? w.left : w.right;
  const mortar = shade(base, -22);
  let tints = '', joints = '';
  for (let row = 0; row < ROWS; row++) {
    const h0 = row * ROW, h1 = h0 + ROW;
    let a = -(row % 2) * 17;
    while (a < len) {
      const bw = 26 + Math.floor(r() * 18);
      const a0 = Math.max(a, 0), a1 = Math.min(a + bw, len);
      const pick = r();
      if (a1 > a0 && pick < 0.66) {
        tints += `<polygon points="${pts([at(a0, h0), at(a1, h0), at(a1, h1), at(a0, h1)])}" fill="${pick < 0.33 ? '#ffffff' : '#000000'}" opacity=".08"/>`;
      }
      if (a1 < len && a1 > 0) joints += `M${at(a1, h0).map(fmt).join(' ')}L${at(a1, h1).map(fmt).join(' ')}`;
      a += bw;
    }
    if (row > 0) joints += `M${at(0, h0).map(fmt).join(' ')}L${at(len, h0).map(fmt).join(' ')}`;
  }
  return tints + `<path d="${joints}" fill="none" stroke="${mortar}" stroke-width="1.1" stroke-linecap="round"/>`;
}

/** Moss clumps hugging the base and the joints (wall pattern 'moss'). */
function mossPatches(plane) {
  const at = wallAt(plane), len = wallLen(plane), r = rnd(plane === 'left' ? 3 : 8);
  let s = '';
  for (let i = 0; i < 24; i++) {
    const a = 6 + r() * (len - 12), low = r() < 0.6, h = low ? 3 + r() * 12 : 30 + r() * 100;
    const [x, y] = at(a, h), rx = 5 + r() * 9, ry = 2.5 + r() * 4;
    s += `<ellipse cx="${fmt(x)}" cy="${fmt(y)}" rx="${fmt(rx)}" ry="${fmt(ry)}" fill="#5d8a43" opacity=".85"/>`
      + `<ellipse cx="${fmt(x - rx * 0.25)}" cy="${fmt(y - ry * 0.35)}" rx="${fmt(rx * 0.55)}" ry="${fmt(ry * 0.5)}" fill="#86b85e" opacity=".9"/>`;
  }
  return s;
}

/** Hanging ivy: a wavering stem with leaves down each side (wall pattern 'ivy'). */
function ivyVines(plane) {
  const at = wallAt(plane), r = rnd(plane === 'left' ? 41 : 57);
  const stems = plane === 'left' ? [34, 98, 214] : [14, 128, 274];
  let s = '';
  for (const a0 of stems) {
    const top = 146 - r() * 8, bottom = 44 + r() * 40;
    const path = [];
    for (let h = top; h >= bottom; h -= 5) path.push(at(a0 + Math.sin(h * 0.19 + a0) * 3.2, h));
    s += `<polyline points="${pts(path)}" fill="none" stroke="#3f6b34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    path.forEach(([x, y], i) => {
      if (i % 2) return;
      const side = (i / 2) % 2 ? 1 : -1;
      s += `<ellipse cx="${fmt(x + side * 4)}" cy="${fmt(y + 1)}" rx="4.4" ry="2.3" transform="rotate(${side * 32} ${fmt(x + side * 4)} ${fmt(y + 1)})" fill="${i % 4 ? '#5a9a45' : '#79b857'}" stroke="#2f5a2a" stroke-width=".7"/>`;
    });
  }
  return s;
}

/** Glowing cracks (wall pattern 'cracks'): ember-lit fissures, glow removed under Low FX. */
function emberCracks(plane) {
  const at = wallAt(plane), len = wallLen(plane), r = rnd(plane === 'left' ? 71 : 83);
  let s = '';
  for (let k = 0; k < 5; k++) {
    let a = 20 + r() * (len - 40), h = 30 + r() * 90;
    const path = [at(a, h)];
    for (let i = 0; i < 6; i++) { a += (r() - 0.45) * 12; h -= 6 + r() * 8; path.push(at(a, h)); }
    s += `<polyline points="${pts(path)}" fill="none" stroke="#ff8a3c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<g ${glowAttr('#ff6a1a', 3)}>${s}</g>`;
}

/** A wall torch: iron plate, arm and cup, a wrapped head and a flickering flame (animated, glowing). */
function wallTorch(plane, a, h, delay = 0) {
  const iron = '#4a4a54';
  const out = (du, dv) => (plane === 'left' ? [a + du, dv] : [dv, a + du]); // (along-offset, outward-offset) -> [u, v]
  const [cu, cv] = out(0, 9);
  const plate = plane === 'left' ? rectV(0, a - 4, a + 4, h, h + 12, iron) : rectU(0, a - 4, a + 4, h, h + 12, iron);
  const arm = plane === 'left' ? box(a - 2, 0, 4, 9, h + 2, h + 6, iron) : box(0, a - 2, 9, 4, h + 2, h + 6, iron);
  const cup = cyl(cu, cv, 4.6, h + 6, h + 13, iron);
  const flame = `<path d="M0 2 C-8 -2 -8 -13 -1 -22 C0 -14 6 -11 5 -3 C4 1 2 2 0 2Z" fill="#ff8a2a" stroke="${ART_INK}" stroke-width="1.2" stroke-linejoin="round"/>`
    + '<path d="M0 1 C-4 -2 -4 -8 0 -13 C1 -8 4 -6 3 -2 C2 0 1 1 0 1Z" fill="#ffe27a"/>';
  const wrap = `<ellipse cx="0" cy="3" rx="4.2" ry="2.4" fill="#6b4a2a" stroke="${ART_INK}" stroke-width="1.2"/>`;
  return plate + arm + cup
    + bill(cu, cv, h + 13, wrap + `<g ${glowAttr('#ff9a3a', 5)}><g class="room-fx room-fx--flicker" style="animation-delay:-${delay}s">${flame}</g></g>`, [-8, -24, 8, 5]);
}

/** A hanging banner on the right wall: a rod, a swallow-tail cloth with a gold flame crest, swaying from the rod. */
function wallBanner(v0, v1, hTop, hBottom) {
  const mid = (v0 + v1) / 2;
  const cloth = poly([P(0, v0 + 2, hTop), P(0, v1 - 2, hTop), P(0, v1 - 2, hBottom), P(0, mid, hBottom + 12), P(0, v0 + 2, hBottom)], '#8e2f3a');
  const trim = isoLine([P(0, v0 + 2, hTop - 4), P(0, v1 - 2, hTop - 4)], 2, '#e8b838');
  const [cx, cy] = P(0, mid, (hTop + hBottom) / 2 + 4);
  const crest = `<g transform="translate(${fmt(cx)} ${fmt(cy)})"><circle r="9" fill="#e8b838" stroke="${ART_INK}" stroke-width="1.4"/>`
    + `<path d="M0 6 C-6 3 -5 -4 0 -8 C1 -3 5 -2 4 3 C3 5 1 6 0 6Z" fill="#8e2f3a" stroke="${ART_INK}" stroke-width="1"/></g>`;
  const rod = box(0, v0 - 3, 4, v1 - v0 + 6, hTop, hTop + 3, '#4a4a54');
  track([[cx - 9, cy - 9], [cx + 9, cy + 9]]);
  return rod + fxg('sway', cloth + trim + crest);
}

/** The shell's wall fixtures: two torches and a banner, drawn over the courses and any pattern. */
const shellFixtures = () => wallTorch('left', 254, 100, 0) + wallTorch('right', 290, 50, 0.9) + wallBanner(6, 46, 132, 76);

/* ---------- floors ---------- */
function earthFloor(f) {
  const r = rnd(5);
  let s = '';
  for (let i = 0; i < 9; i++) s += poly(ellipsePoints(14 + r() * 230, 14 + r() * 270, 0, 12 + r() * 14, 8 + r() * 10), shade(f.base, -9), { stroke: null, op: 0.45 });
  for (let i = 0; i < 52; i++) {
    const [u, v] = [8 + r() * 244, 8 + r() * 284];
    s += poly(ellipsePoints(u, v, 0, 2.4 + r() * 2.6, 1.4 + r() * 1.6, 10), shade(f.base, r() < 0.5 ? 16 : -20), { stroke: null });
  }
  for (let k = 0; k < 6; k++) {
    let u = 20 + r() * 220, v = 20 + r() * 260;
    const path = [P(u, v)];
    for (let i = 0; i < 5; i++) { u += (r() - 0.5) * 16; v += (r() - 0.3) * 14; path.push(P(u, v)); }
    s += isoLine(path, 1, shade(f.base, -34), { op: 0.7 });
  }
  return s;
}

function flagFloor(f) {
  const r = rnd(9), RU = GEOMETRY.ROOM_SIZE.u, RV = GEOMETRY.ROOM_SIZE.v, ROW = 36;
  let tints = '', seams = '';
  for (let v = 0; v < RV; v += ROW) {
    const v1 = Math.min(v + ROW, RV);
    let u = -(((v / ROW) % 2) * 22);
    while (u < RU) {
      const sw = 44 + Math.floor(r() * 24), u0 = Math.max(u, 0), u1 = Math.min(u + sw, RU), pick = r();
      if (u1 > u0 && pick < 0.7) tints += `<polygon points="${pts([P(u0, v), P(u1, v), P(u1, v1), P(u0, v1)])}" fill="${pick < 0.35 ? '#ffffff' : '#000000'}" opacity=".07"/>`;
      if (u1 < RU && u1 > 0) seams += `M${P(u1, v).map(fmt).join(' ')}L${P(u1, v1).map(fmt).join(' ')}`;
      u += sw;
    }
    if (v > 0) seams += `M${P(0, v).map(fmt).join(' ')}L${P(RU, v).map(fmt).join(' ')}`;
  }
  return tints + `<path d="${seams}" fill="none" stroke="${shade(f.base, -32)}" stroke-width="1.4" stroke-linecap="round"/>`;
}

function slateFloor(f) {
  const r = rnd(14), RU = GEOMETRY.ROOM_SIZE.u, RV = GEOMETRY.ROOM_SIZE.v, STEP = 30;
  let tints = '', dark = '', light = '';
  for (let a = 0; a * STEP < RU; a++) {
    for (let b = 0; b * STEP < RV; b++) {
      const [u0, v0] = [a * STEP, b * STEP], [u1, v1] = [Math.min(u0 + STEP, RU), Math.min(v0 + STEP, RV)], pick = r();
      if (pick < 0.55) tints += `<polygon points="${pts([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)])}" fill="${pick < 0.28 ? '#ffffff' : '#000000'}" opacity=".07"/>`;
    }
  }
  for (let k = STEP; k < RV; k += STEP) { dark += `M${P(0, k).map(fmt).join(' ')}L${P(RU, k).map(fmt).join(' ')}`; light += `M${P(0, k + 1.5).map(fmt).join(' ')}L${P(RU, k + 1.5).map(fmt).join(' ')}`; }
  for (let k = STEP; k < RU; k += STEP) { dark += `M${P(k, 0).map(fmt).join(' ')}L${P(k, RV).map(fmt).join(' ')}`; light += `M${P(k + 1.5, 0).map(fmt).join(' ')}L${P(k + 1.5, RV).map(fmt).join(' ')}`; }
  return tints + `<path d="${dark}" fill="none" stroke="${shade(f.base, -38)}" stroke-width="1.4"/><path d="${light}" fill="none" stroke="${shade(f.base, 22)}" stroke-width=".8" opacity=".7"/>`;
}

function runeFloor(f) {
  const RU = GEOMETRY.ROOM_SIZE.u, RV = GEOMETRY.ROOM_SIZE.v, STEP = 25;
  let tiles = '', runes = '';
  for (let a = 0; a * STEP < RU; a++) {
    for (let b = 0; b * STEP < RV; b++) {
      const [u0, v0] = [a * STEP, b * STEP], [u1, v1] = [Math.min(u0 + STEP, RU), Math.min(v0 + STEP, RV)];
      if ((a + b) % 2) tiles += `<polygon points="${pts([P(u0, v0), P(u1, v0), P(u1, v1), P(u0, v1)])}" fill="${f.checker}"/>`;
      if ((a * 3 + b * 5) % 7 === 0 && u1 - u0 === STEP && v1 - v0 === STEP) {
        const [x, y] = P(u0 + STEP / 2, v0 + STEP / 2);
        runes += `<g transform="translate(${fmt(x)} ${fmt(y)}) scale(1 .5)"><path d="M-4 -5 L4 5 M4 -5 L-4 5 M0 -8 V8" fill="none" stroke="#7de3ff" stroke-width="1.6" stroke-linecap="round"/></g>`;
      }
    }
  }
  return tiles + `<g ${glowAttr('#7de3ff', 3)}>${runes}</g>`;
}

/* ---------- the window: a cave mouth on the right wall, drawn in world coords inside WINDOW_GAP ---------- */
const CAVE = { vc: 198, rxIn: 35, ryIn: 30, rxOut: 40, ryOut: 37, hBottom: 74, hRimBottom: 64, hSpring: 108 }; // inside WINDOW_GAP v 158-238, h from 56
function caveArch(rx, ry, hb) {
  const out = [[CAVE.vc - rx, hb], [CAVE.vc - rx, CAVE.hSpring]];
  for (let i = 1; i < 18; i++) {
    const t = Math.PI - (Math.PI * i) / 18;
    out.push([CAVE.vc + rx * Math.cos(t), CAVE.hSpring + ry * Math.sin(t)]);
  }
  out.push([CAVE.vc + rx, CAVE.hSpring], [CAVE.vc + rx, hb]);
  return out.map(([v, h]) => P(0, v, h));
}
const caveRimQuad = (t0, t1) => [
  P(0, CAVE.vc + CAVE.rxIn * Math.cos(t0), CAVE.hSpring + CAVE.ryIn * Math.sin(t0)), P(0, CAVE.vc + CAVE.rxOut * Math.cos(t0), CAVE.hSpring + CAVE.ryOut * Math.sin(t0)),
  P(0, CAVE.vc + CAVE.rxOut * Math.cos(t1), CAVE.hSpring + CAVE.ryOut * Math.sin(t1)), P(0, CAVE.vc + CAVE.rxIn * Math.cos(t1), CAVE.hSpring + CAVE.ryIn * Math.sin(t1))
];
const cavePt = (v, h) => P(0, v, h);

/* ---------- station helpers ---------- */
const STONE = '#8c8996', STONE_DK = '#6a6776', STONE_LT = '#a6a3b2';
const IRON = '#4a525c', IRON_LT = '#6b7480';
const WOOD = '#8a5a35', WOOD_DK = '#6a4526', WOOD_LT = '#b07a45';
const GOLD = '#e6b832', GOLD_HI = '#ffd95a', GOLD_DK = '#b8861e';
const ICE = '#aee2f4', ICE_HI = '#e4f6fb', ICE_DK = '#7ec8e3';
const FIRE = '#ff8a2a', FIRE_HI = '#ffe27a', EMBER = '#ff6a1a';
const CLOAK = '#8e2f3a';

/** A flat coin lying on the floor or a surface. */
const coin = (u, v, h, r = 2.4, color = GOLD) => poly(ellipsePoints(u, v, h, r, r * 0.8, 8), color, { sw: 0.8 });

/** A gem: a small faceted diamond billboard. */
const gem = (u, v, h, color) => bill(u, v, h, `<path d="M0 -4.5 L3.2 -1.4 L0 3 L-3.2 -1.4Z" fill="${color}" stroke="${ART_INK}" stroke-width="1" stroke-linejoin="round"/><path d="M-1.4 -2 L0 -3.4 L1 -2" fill="none" stroke="#fff" stroke-width=".8" opacity=".8"/>`, [-4, -5, 4, 3.5]);

/** A twinkle (animated): used on coins, gems and the hoard. */
const sparkle = (u, v, h, delay) => bill(u, v, h, fxg('glint', '<path d="M0 -3.6 L1 -1 L3.6 0 L1 1 L0 3.6 L-1 1 L-3.6 0 L-1 -1Z" fill="#fff6c2"/>', delay), [-4, -4, 4, 4]);

/** A trophy cup billboard (s = scale). */
const trophy = (u, v, h, s = 0.6) => bill(u, v, h,
  `<g transform="scale(${s})"><path d="M-9 -24 h18 q0 12 -9 14 q-9 -2 -9 -14z" fill="${GOLD}" stroke="${ART_INK}" stroke-width="1.6" stroke-linejoin="round"/>`
  + `<path d="M-9 -22 q-7 0 -5 7 q2 4 6 3 M9 -22 q7 0 5 7 q-2 4 -6 3" fill="none" stroke="${ART_INK}" stroke-width="1.6"/>`
  + `<rect x="-1.8" y="-10" width="3.6" height="6" fill="${GOLD_DK}"/><rect x="-7" y="-4" width="14" height="4" rx="1" fill="${GOLD_DK}" stroke="${ART_INK}" stroke-width="1.4"/>`
  + `<path d="M-5 -21 q0 6 3 8" fill="none" stroke="#fff6c2" stroke-width="1.4" stroke-linecap="round"/></g>`, [-14 * s, -25 * s, 14 * s, 0.5]);

/** A rosette ribbon billboard. */
const ribbon = (u, v, h, s = 0.6, color = '#c0392b') => bill(u, v, h,
  `<g transform="scale(${s})"><path d="M-6 -2 l-4 12 l6 -3 l3 5z M6 -2 l4 12 l-6 -3 l-3 5z" fill="${color}" stroke="${ART_INK}" stroke-width="1.3" stroke-linejoin="round"/>`
  + `<circle cx="0" cy="-8" r="9" fill="${color}" stroke="${ART_INK}" stroke-width="1.5"/><circle cx="0" cy="-8" r="4.6" fill="${GOLD}" stroke="${ART_INK}" stroke-width="1.1"/></g>`, [-10 * s, -17 * s, 10 * s, 11 * s]);

/** A crown billboard (hoard top). */
const crown = (u, v, h, s = 0.6) => bill(u, v, h,
  `<g transform="scale(${s})"><path d="M-12 0 l-2 -16 l7 7 l7 -13 l7 13 l7 -7 l-2 16z" fill="${GOLD}" stroke="${ART_INK}" stroke-width="1.6" stroke-linejoin="round"/><rect x="-12" y="-2" width="24" height="4" fill="${GOLD_DK}" stroke="${ART_INK}" stroke-width="1.2"/>`
  + `<circle cx="0" cy="-8" r="2" fill="#d63a4a"/><circle cx="-7" cy="-5" r="1.4" fill="#4aa8e8"/><circle cx="7" cy="-5" r="1.4" fill="#5cc46a"/></g>`, [-15 * s, -23 * s, 15 * s, 3 * s]);

/** A flame billboard (animated flicker, glowing). */
const flameArt = s => `<g transform="scale(${s})"><path d="M0 2 C-8 -2 -8 -13 -1 -22 C0 -14 6 -11 5 -3 C4 1 2 2 0 2Z" fill="${FIRE}" stroke="${ART_INK}" stroke-width="1.2" stroke-linejoin="round"/><path d="M0 1 C-4 -2 -4 -8 0 -13 C1 -8 4 -6 3 -2 C2 0 1 1 0 1Z" fill="${FIRE_HI}"/></g>`;
const flame = (u, v, h, s = 1, delay = 0) => bill(u, v, h, `<g ${glowAttr('#ff9a3a', 5)}>${fxg('flicker', flameArt(s), delay)}</g>`, [-9 * s, -23 * s, 9 * s, 3]);

/** Rising embers (animated, glowing): n tiny sparks above a point, each on its own delay. */
function embers(u, v, h, n = 4) {
  const r = rnd(u * 7 + v * 3 + n);
  let s = '';
  for (let i = 0; i < n; i++) s += bill(u + (r() - 0.5) * 12, v, h + (r() - 0.5) * 3, `<g ${glowAttr('#ff7a2a', 3)}>${fxg('embers', `<circle r="${(1 + r() * 0.8).toFixed(1)}" fill="#ffb35a"/>`, i * 0.6 + r())}</g>`, [-2, -2, 2, 2]);
  return s;
}

/** Stone courses (mortar lines) on the plane v = vp, then on the plane u = up. */
function brickV(vp, u0, u1, h0, h1, color, row = 9, bw = 15) {
  const segs = [];
  let r = 0;
  for (let h = h0 + row; h < h1 - 1; h += row, r++) {
    segs.push([P(u0, vp, h), P(u1, vp, h)]);
    for (let u = u0 + (r % 2 ? bw / 2 : bw); u < u1 - 1; u += bw) segs.push([P(u, vp, h - row), P(u, vp, h)]);
  }
  return isoLines(segs, 0.9, color, 0.6);
}
function brickU(up, v0, v1, h0, h1, color, row = 9, bw = 15) {
  const segs = [];
  let r = 0;
  for (let h = h0 + row; h < h1 - 1; h += row, r++) {
    segs.push([P(up, v0, h), P(up, v1, h)]);
    for (let v = v0 + (r % 2 ? bw / 2 : bw); v < v1 - 1; v += bw) segs.push([P(up, v, h - row), P(up, v, h)]);
  }
  return isoLines(segs, 0.9, color, 0.6);
}
/** A box with stone courses on both visible faces. */
const stoneBox = (u, v, du, dv, h0, h1, color = STONE) => box(u, v, du, dv, h0, h1, color) + brickU(u + du, v, v + dv, h0, h1, shade(color, -38)) + brickV(v + dv, u, u + du, h0, h1, shade(color, -38));

/** An arch-topped opening on the plane v = vp: straight sides to hs, then an elliptical arch of height ry. */
function archV(vp, uc, hw, h0, hs, ry, fill, o) {
  const out = [[uc - hw, h0], [uc - hw, hs]];
  for (let i = 1; i < 12; i++) {
    const t = Math.PI - (Math.PI * i) / 12;
    out.push([uc + hw * Math.cos(t), hs + ry * Math.sin(t)]);
  }
  out.push([uc + hw, hs], [uc + hw, h0]);
  return poly(out.map(([u, h]) => P(u, vp, h)), fill, o);
}

/** A disc on the plane v = vp (a round door, a shield): centre (uc, hc), radii (ru, rh) in floor units. */
const discV = (vp, uc, hc, ru, rh, fill, o, n = 20) => poly(Array.from({ length: n }, (_, i) => P(uc + ru * Math.cos((i / n) * Math.PI * 2), vp, hc + rh * Math.sin((i / n) * Math.PI * 2))), fill, o);

/** Wooden plank face on the plane v = vp: the rect plus vertical seams. */
function planksV(vp, u0, u1, h0, h1, color, n) {
  const us = Array.from({ length: n - 1 }, (_, i) => u0 + ((i + 1) * (u1 - u0)) / n);
  return rectV(vp, u0, u1, h0, h1, color) + isoLines(us.map(u => [P(u, vp, h0), P(u, vp, h1)]), 0.9, shade(color, -34), 0.8);
}

/** A mound of stacked truncated cones (coins, rock). */
function mound(cu, cv, ru, rv, hTop, layers, color, topScale = 0.45) {
  let s = '';
  for (let i = 0; i < layers; i++) {
    const k0 = 1 - (1 - topScale) * (i / layers), k1 = 1 - (1 - topScale) * ((i + 1) / layers);
    s += cylE(cu, cv, ru * k0, rv * k0, (hTop * i) / layers, (hTop * (i + 1)) / layers, i % 2 ? tint(color, 7) : color, ru * k1, rv * k1);
  }
  return s;
}

/** Coins scattered inside an ellipse on a surface at height h (r = coin radius), kept clear of the rim by `fill`. */
function coinScatter(cu, cv, ru, rv, h, n, seed, fill = 0.9, r = 2.4) {
  const g = rnd(seed);
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = g() * Math.PI * 2, d = Math.sqrt(g()) * fill;
    s += coin(cu + ru * d * Math.cos(a), cv + rv * d * Math.sin(a), h, r * (0.8 + g() * 0.5), i % 3 ? GOLD : GOLD_HI);
  }
  return s;
}

/** Straw strands over the ring rMin..rMax of an ellipse at height h; near = only the viewer-facing half. */
function straw(cu, cv, ru, rv, h, n, seed, { rMin = 0.3, rMax = 0.95, near = false } = {}) {
  const g = rnd(seed), [t0, t1] = nearRange(ru, rv);
  const light = [], dark = [];
  for (let i = 0; i < n; i++) {
    const a = near ? t0 + g() * (t1 - t0) : g() * Math.PI * 2, rr = rMin + g() * (rMax - rMin);
    const u = cu + ru * rr * Math.cos(a), v = cv + rv * rr * Math.sin(a);
    const ang = g() * Math.PI, len = 4 + g() * 5;
    const u2 = u + Math.cos(ang) * len, v2 = v + Math.sin(ang) * len * (rv / ru);
    if (((u2 - cu) / ru) ** 2 + ((v2 - cv) / rv) ** 2 > 0.94) continue;
    (i % 2 ? dark : light).push([P(u, v, h + g() * 1.5), P(u2, v2, h + g() * 1.5)]);
  }
  return isoLines(light, 1.3, '#f0d680') + isoLines(dark, 1.2, '#8f6f26');
}

/** A nest: a woven bowl with a hollow. Returns { back, front }: front is the near rim, drawn over a sleeping creature. */
function nest(cu, cv, ru, rv, h0, h1, tone, innerTone, seed) {
  const [t0, t1] = nearRange(ru, rv), ri = 0.74, rj = 0.7;
  const side = poly([...arcPts(cu, cv, h0, ru, rv, t0, t1), ...arcPts(cu, cv, h1, ru, rv, t0, t1).reverse()], shade(tone, -14));
  const weave = isoLines([0.33, 0.66].flatMap(k => {
    const a = arcPts(cu, cv, h0 + (h1 - h0) * k, ru, rv, t0, t1, 10);
    return a.slice(1).map((p, i) => [a[i], p]).filter((_, i) => i % 2 === 0);
  }), 1.1, shade(tone, -38), 0.8);
  const nearRim = poly([...arcPts(cu, cv, h1, ru, rv, t0, t1), ...arcPts(cu, cv, h1, ru * ri, rv * rj, t0, t1).reverse()], shade(tone, 12));
  return {
    back: side + weave + ellH(cu, cv, h1, ru, rv, shade(tone, 12)) + ellH(cu, cv, h1 - 0.4, ru * ri, rv * rj, innerTone, { sw: 1.2 })
      + straw(cu, cv, ru, rv, h1, 40, seed, { rMin: 0.3, rMax: 0.95 }),
    front: side + weave + nearRim + straw(cu, cv, ru, rv, h1, 16, seed + 1, { rMin: 0.78, rMax: 0.95, near: true })
  };
}

/** A fur pelt: an irregular oval with a scalloped edge and spots, flat at height h. */
function pelt(cu, cv, ru, rv, h, tone, seed) {
  const g = rnd(seed), n = 18, pts2 = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2, k = 0.9 + 0.1 * Math.sin(i * 2.7) + g() * 0.04;
    pts2.push(P(cu + ru * k * Math.cos(t), cv + rv * k * Math.sin(t), h));
  }
  let s = poly(pts2, tone, { sw: 1.4 });
  for (let i = 0; i < 6; i++) s += poly(ellipsePoints(cu + (g() - 0.5) * ru, cv + (g() - 0.5) * rv, h + 0.2, 2.6 + g() * 2, 1.8 + g() * 1.4, 8), shade(tone, -26), { stroke: null });
  return s;
}

/** Vertical seams on the plane v = vp at the given u values; and on the plane u = up at the given v values. */
const seamsV = (vp, us, h0, h1, color = ART_INK, w = 0.9, op = 0.8) => isoLines(us.map(u => [P(u, vp, h0), P(u, vp, h1)]), w, color, op);
const seamsU = (up, vs, h0, h1, color = ART_INK, w = 0.9, op = 0.8) => isoLines(vs.map(v => [P(up, v, h0), P(up, v, h1)]), w, color, op);

/** A rivet row along a strap on the plane v = vp. */
const rivetsV = (vp, us, h, color = IRON_LT) => us.map(u => bill(u, vp, h, `<circle r="1.3" fill="${color}" stroke="${ART_INK}" stroke-width=".7"/>`, [-1.5, -1.5, 1.5, 1.5])).join('');

/** Icicles / frost drips hanging from an edge on the plane v = vp: triangles at the given u values. */
const icicles = (vp, us, hTop, len, color = ICE_HI) => us.map((u, i) => poly([P(u - 1.8, vp, hTop), P(u + 1.8, vp, hTop), P(u, vp, hTop - len * (0.6 + 0.4 * ((i * 7) % 3) / 2))], color, { sw: 1 })).join('');

/** A pointed ice crystal: a box prism with a pyramid cap. */
function crystal(u, v, du, dv, h0, h1, color = ICE) {
  const cu = u + du / 2, cv = v + dv / 2, tip = h1 + Math.max(du, dv) * 0.9;
  return box(u, v, du, dv, h0, h1, color)
    + poly([P(u, v + dv, h1), P(u + du, v + dv, h1), P(cu, cv, tip)], shade(color, -10), { sw: 1.2 })
    + poly([P(u + du, v, h1), P(u + du, v + dv, h1), P(cu, cv, tip)], shade(color, 8), { sw: 1.2 });
}

/** A fur drape over a rim: the near arc of an ellipse at hTop, hanging to a scalloped hem at hBot. */
function drape(cu, cv, ru, rv, hTop, hBot, tone, trim = 0.35) {
  const [t0, t1] = nearRange(ru, rv), a = t0 + trim, b = t1 - trim;
  const top = arcPts(cu, cv, hTop, ru + 0.5, rv + 0.5, a, b, 12);
  const hem = arcPts(cu, cv, hBot, ru + 2.5, rv + 2.5, a, b, 12).map((p, i) => [p[0], p[1] + (i % 2 ? 3 : 0)]).reverse();
  return poly([...top, ...hem], tone, { sw: 1.4 });
}

/** The tall station helper: a dragon egg billboard. */
const egg = (u, v, h) => bill(u, v, h, `<ellipse cx="0" cy="-5" rx="4.2" ry="5.4" fill="#b5e0c9" stroke="${ART_INK}" stroke-width="1.2"/><circle cx="-1.2" cy="-6.5" r="1" fill="#6cc59a"/><circle cx="1.5" cy="-3.6" r=".9" fill="#6cc59a"/><path d="M-2.4 -8.4 q1 -1 2 -.6" stroke="#fff" stroke-width=".9" fill="none"/>`, [-5, -11, 5, 0.5]);

/** Coins scattered on the ring between two radii of a heap layer. */
function coinRing(cu, cv, ru, rv, kIn, kOut, h, n, seed, r = 2.2) {
  const g = rnd(seed);
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = g() * Math.PI * 2, d = kIn + g() * (kOut - kIn);
    s += coin(cu + ru * d * Math.cos(a), cv + rv * d * Math.sin(a), h, r * (0.8 + g() * 0.5), i % 3 ? GOLD : GOLD_HI);
  }
  return s;
}

/* ---------- armour ---------- */
const STEEL = '#b4bdc8', STEEL_DK = '#8f98a3';

/** A horned helm billboard (s = scale), standing on a shelf. */
const helm = (u, v, h, s = 0.8) => bill(u, v, h,
  `<g transform="scale(${s})"><path d="M-9 0 Q-9 -17 0 -17 Q9 -17 9 0 Z" fill="${STEEL}" stroke="${ART_INK}" stroke-width="1.6" stroke-linejoin="round"/>`
  + `<path d="M-9 -1 h18" stroke="${ART_INK}" stroke-width="1.6"/><path d="M-6 -8 h12" stroke="#1c2024" stroke-width="2.6" stroke-linecap="round"/><path d="M0 -17 v9" stroke="${STEEL_DK}" stroke-width="1.4"/>`
  + `<path d="M-9 -9 Q-16 -10 -14 -20 M9 -9 Q16 -10 14 -20" fill="none" stroke="#f7ead0" stroke-width="3" stroke-linecap="round"/>`
  + `<path d="M-9 -9 Q-16 -10 -14 -20 M9 -9 Q16 -10 14 -20" fill="none" stroke="${ART_INK}" stroke-width=".7" stroke-linecap="round"/></g>`, [-16 * s, -21 * s, 16 * s, 1]);

/** A suit of armour billboard (origin at the feet), scaled s. full = greaves and arms, else the plates float on a stand; plume = a crest. */
function armour(u, v, h, full, plume, s) {
  const k = `stroke="${ART_INK}" stroke-width="1.5" stroke-linejoin="round"`;
  let f = '';
  if (full) {
    f += `<path d="M-10 -28 h8 v24 h-10z M2 -28 h8 v24 h2z" fill="${STEEL_DK}" ${k}/><path d="M-12 -4 h10 v4 h-12z M2 -4 h10 v4 h2z" fill="#5a3a1f" ${k}/>`;
    f += `<rect x="-19" y="-58" width="6" height="22" rx="2" fill="${STEEL_DK}" ${k}/><rect x="13" y="-58" width="6" height="22" rx="2" fill="${STEEL_DK}" ${k}/><circle cx="-16" cy="-34" r="3.4" fill="${STEEL}" ${k}/><circle cx="16" cy="-34" r="3.4" fill="${STEEL}" ${k}/>`;
  }
  f += `<path d="M-12 -38 H12 L15 -26 H-15 Z" fill="${STEEL_DK}" ${k}/><path d="M-9 -32 H9" stroke="${ART_INK}" stroke-width="1" opacity=".6"/>`;
  f += `<path d="M-11 -66 Q0 -72 11 -66 L10 -38 Q0 -34 -10 -38 Z" fill="${STEEL}" ${k}/><path d="M0 -68 V-37" stroke="${STEEL_DK}" stroke-width="1.4"/><path d="M-6 -62 Q-6 -52 -4 -44" fill="none" stroke="#fff" stroke-width="1.4" opacity=".7" stroke-linecap="round"/>`;
  f += `<path d="M-8 -52 h16" stroke="${GOLD}" stroke-width="2"/><ellipse cx="-14" cy="-64" rx="7.5" ry="5.5" fill="${STEEL}" ${k}/><ellipse cx="14" cy="-64" rx="7.5" ry="5.5" fill="${STEEL}" ${k}/>`;
  f += `<path d="M-6 -68 h12 v4 h-12z" fill="${STEEL_DK}" ${k}/><path d="M-8 -70 Q-8 -85 0 -85 Q8 -85 8 -70 Z" fill="${STEEL}" ${k}/><path d="M-6 -76 h12" stroke="#1c2024" stroke-width="2.8" stroke-linecap="round"/><path d="M0 -85 v9" stroke="${STEEL_DK}" stroke-width="1.4"/>`;
  f += `<path d="M-8 -78 Q-15 -79 -13 -88 M8 -78 Q15 -79 13 -88" fill="none" stroke="#f7ead0" stroke-width="3" stroke-linecap="round"/>`;
  if (plume) f += `<path d="M-1 -85 Q9 -91 4 -99 Q-4 -92 -1 -85Z" fill="${CLOAK}" ${k}/>`;
  const top = plume ? 100 : 89;
  return bill(u, v, h, `<g transform="scale(${s})">${f}</g>`, [-20 * s, -top * s, 20 * s, 2]);
}

/* ---------- decor helpers: wall-plane shapes and small props (no DOM) ---------- */
const HI = 'rgba(255,255,255,.7)';
const COPPER = '#c9753a', BONE = '#efe4c8', TEAL = '#2f6b5a', TEAL_HI = '#3fa57c', GLOW = '#7de3ff', HIDE = '#a98660';
const ringPts = (n, f) => Array.from({ length: n }, (_, i) => f((i / n) * Math.PI * 2));
/** An ellipse standing on the right wall (plane u = up), centre (vc, hc), radii (rv, rh). */
const ellU = (up, vc, hc, rv, rh, fill, o, n = 16) => poly(ringPts(n, t => P(up, vc + rv * Math.cos(t), hc + rh * Math.sin(t))), fill, o);
/** A flat cut-out on the right wall with a visible thickness: a darker back copy, the front copy on top. vh = [[v, h], ...]. */
const slabU = (up, th, vh, fill, o) => poly(vh.map(([v, h]) => P(up, v, h)), shade(fill, -22), o) + poly(vh.map(([v, h]) => P(up + th, v, h)), fill, o);
/** A short candle with a flickering flame (animated). */
const candle = (u, v, h, hh = 5, s = 0.5, delay = 0) => cyl(u, v, 3, h, h + hh, '#f4ead2', { sw: 1 }) + flame(u, v, h + hh, s, delay);
/** A ring line round a cylinder (near half only). */
const bandAt = (cu, cv, r, h, color = IRON, w = 1.4) => isoLine(arcPts(cu, cv, h, r, r, ...nearRange(r, r)), w, color);
/** A flask: glass body in a colour, a neck and a cork (a potion). */
const flask = (u, v, h, c) => cyl(u, v, 3.6, h, h + 7, c, { sw: 1.2 })
  + bill(u, v, h + 7, `<rect x="-1.5" y="-6" width="3" height="6" fill="#d7f0ff" stroke="${ART_INK}" stroke-width="1.1"/><rect x="-2" y="-8.4" width="4" height="2.6" rx="1" fill="${WOOD_LT}" stroke="${ART_INK}" stroke-width="1"/>`, [-2.5, -9, 2.5, 0]);
/** A row of glowing rune strokes on the left wall plane v = vp. */
function runeRowV(vp, u0, h, n) {
  const segs = [];
  for (let i = 0; i < n; i++) {
    const u = u0 + i * 5.5, k = (i * 5 + 2) % 3;
    segs.push([P(u, vp, h), P(u, vp, h + 7)]);
    if (k === 0) segs.push([P(u, vp, h + 6), P(u + 3, vp, h + 3)]);
    if (k === 1) segs.push([P(u, vp, h + 2), P(u + 3, vp, h + 5)], [P(u + 3, vp, h + 5), P(u, vp, h + 7)]);
    if (k === 2) segs.push([P(u - 2.2, vp, h + 4), P(u + 2.2, vp, h + 4)]);
  }
  return `<g ${glowAttr(GLOW, 2)}>${isoLines(segs, 1.3, GLOW)}</g>`;
}
/** A glowing orb (animated glint) on a wire: billboard centred on the point. */
const orb = (u, v, h, c, delay) => bill(u, v, h, `<g ${glowAttr(c, 3)}>${fxg('glint', `<circle r="2.6" fill="${c}" stroke="${ART_INK}" stroke-width="1"/><circle cx="-.8" cy="-.8" r=".8" fill="#fff"/>`, delay)}</g>`, [-3.4, -3.4, 3.4, 3.4]);
/** A double-stroked path (ink under colour) for limbs, handles and spouts inside a billboard. */
const limb = (d, w, color) => `<path d="${d}" fill="none" stroke="${ART_INK}" stroke-width="${w + 2.4}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

/** A horizontal band of a floor ellipse (normalised offsets a..b across its depth, -1..1) as a flat polygon at height h. */
function ellBand(cu, cv, ru, rv, a, b, h, fill) {
  const arc = y => Math.sqrt(Math.max(0, 1 - y * y));
  const ys = Array.from({ length: 7 }, (_, i) => a + ((b - a) * i) / 6);
  return poly([...ys.map(y => P(cu + ru * arc(y), cv + rv * y, h)), ...ys.map(y => P(cu - ru * arc(y), cv + rv * y, h)).reverse()], fill, { stroke: null });
}
/** A closed ring line (a flat ellipse outline) at height h, optionally dashed. */
const ringLine = (cu, cv, h, ru, rv, w, color, dash) => { const p = ellipsePoints(cu, cv, h, ru, rv, 32); return isoLine([...p, p[0]], w, color, dash ? { dash } : {}); };

const DRAGON_ROOM = {
  ink: '#2b2630',

  /* The 10 styles keep the slot meaning of the herb's: wall-* give left / right / skirting (+ optional pattern), floor-* give base (+ pattern). */
  styles: {
    'wall-white': { left: '#9a9aa4', right: '#aeaeb8', skirting: '#7f7f8a' },
    'wall-lavender': { left: '#7d8aa3', right: '#8f9cb5', skirting: '#667189' },
    'wall-mint': { left: '#7f9a92', right: '#92aca4', skirting: '#647c75', pattern: 'moss' },
    'wall-peach': { left: '#a8827a', right: '#bc9a90', skirting: '#8a655e', pattern: 'cracks' },
    'wall-sky': { left: '#bfa77f', right: '#d1ba92', skirting: '#a38c66' },
    'wall-sprig': { left: '#939f8a', right: '#a6b29c', skirting: '#74806c', pattern: 'ivy' },

/* ======================================================================

    + [6, 24, 42].map(h => rectV(26, 14, 58, h, h + 13, '#e2b989') + bill(36, 26, h + 6.5, `<circle r="2" fill="#8a5a2b" stroke="${ART_INK}" stroke-width="1.4"/>`, [-2, -2, 2, 2])).join('')

const HERB_REFERENCE = {

      ? bill(0, 210, 116, '<path d="M0 -8 a8 8 0 1 0 6 13 a6 6 0 1 1 -6 -13z" fill="#fff6c2"/>', [-8, -9, 8, 6]) + bill(0, 178, 120, '<circle r="1.4" fill="#fff"/>', [-2, -2, 2, 2])

      + ellH(GEOMETRY.RUG.cu, GEOMETRY.RUG.cv, 1, GEOMETRY.RUG.ru - 10, GEOMETRY.RUG.rv - 8, '#fbc6d9', { stroke: null })

        + (w > 0 ? `<rect x="-17" y="-5" width="${fmt(w)}" height="6" rx="3" fill="${gaugeColour(pct)}"/>` : ''), [-19, -7, 19, 3]);
    },

      return bill(u, v, h, fxg('steam', '<path d="M-4 -4 q5 -8 0 -14 M5 -6 q5 -8 0 -14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>'), [-6, -20, 10, 0]);
    },

    },
    servedPlate: level => {
      const [u, v, h] = GEOMETRY.STATION_ANCHORS.cookerPlate[level - 1];
      return bill(u, v, h, `<ellipse cx="0" cy="-2" rx="11" ry="4.5" fill="#fff" stroke="${ART_INK}" stroke-width="1.4"/><path d="M-7 -4 q7 -10 14 0z" fill="#f4a259" stroke="${ART_INK}" stroke-width="1.2"/>`, [-11, -12, 11, 3]);
    },
    nightDim: () => `<rect class="night-dim" x="${GEOMETRY.ROOM_WORLD.x}" y="${GEOMETRY.ROOM_WORLD.y}" width="${GEOMETRY.ROOM_WORLD.width}" height="${GEOMETRY.ROOM_WORLD.height}" fill="${GEOMETRY.NIGHT_DIM_FILL}" pointer-events="none"/>`
