<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pantry Plan Prototype</title>
<style>
:root{
  --brand:#4a3f80; --brand-dark:#3a3266; --brand-light:#6b5fa0; --tint:#efedf7; --leaf:#7cc36b;
  --text:#2c3e50; --muted:#6c757d; --bg:#fff; --bg2:#f8f9fa; --border:#e9ecef;
  --ok:#28a745; --err:#dc3545; --cheat:#ff6b35; --cart:#e8890c; --amber:#e3b45c;
  --shadow:0 10px 25px rgba(0,0,0,.15);
  --a-produce:#4caf50; --a-meat:#f44336; --a-dairy:#2196f3; --a-bakery:#ff9800; --a-grains:#795548; --a-canned:#9e9e9e; --a-spices:#8bc34a; --a-frozen:#03a9f4; --a-snacks:#e91e63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);background:#d9d6e6}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}

/* ---------- prototype chrome (not part of the design) ---------- */
.proto{height:46px;background:#1f1a3a;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px}
.proto b{font-size:14px;margin-right:6px}
.proto .seg2{display:flex;background:#3a3361;border-radius:999px;padding:3px}
.proto .seg2 button{border:none;background:transparent;color:#cfc8f0;border-radius:999px;padding:5px 14px;font-size:13px}
.proto .seg2 button.on{background:#fff;color:#1f1a3a;font-weight:700}
.proto .rst{margin-left:auto;border:1px solid #5b5390;background:transparent;color:#d9d4f5;border-radius:8px;padding:5px 10px;font-size:12px}
.proto .hint{color:#a49dd0}
.stage{height:calc(100% - 46px);display:flex;justify-content:center;align-items:flex-start}
.stage.web .app{width:100%;height:100%}
.stage.mobile{padding:18px 0;overflow:auto}
.phone{width:414px;height:868px;border-radius:48px;background:#111;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35);flex:none}
.stage.mobile .app{width:390px;height:844px;border-radius:36px;overflow:hidden}

/* ---------- app shell ---------- */
.app{position:relative;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
.sbar{height:30px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:0 24px;flex:none}
.scroll{flex:1;overflow-y:auto;position:relative}
.m .scroll{padding-bottom:84px}

/* header */
.hdr{background:var(--brand);color:#fff;flex:none;position:relative;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hdr-in{max-width:1240px;margin:0 auto;min-height:64px;display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"brand nav week acct";align-items:center;gap:12px;padding:0 16px}
.m .hdr-in{grid-template-columns:1fr auto;grid-template-areas:"brand acct" "week week";row-gap:6px;padding:6px 12px 10px;min-height:0}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;background:none;border:none;color:#fff;min-height:44px;padding:0 6px 0 0;border-radius:12px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.m .brand svg{width:36px;height:36px}
.brand .w{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.m .brand .w{font-size:17px}
.brand .w span{font-weight:500;opacity:.85}
.hnav{grid-area:nav;display:flex;gap:4px}
.m .hnav{display:none}
.hnav button{border:none;background:transparent;color:#d9d4f5;font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;min-height:44px;display:flex;gap:7px;align-items:center}
.hnav button:hover{background:rgba(255,255,255,.1);color:#fff}
.hnav button.on{background:rgba(255,255,255,.16);color:#fff}
.wk{grid-area:week;justify-self:end;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.18);border-radius:999px;padding:4px}
.m .wk{justify-self:stretch}
.wk .ar{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:#fff;font-size:18px}
.wk .ar:hover{background:rgba(255,255,255,.14)}
.wk .rng{border:none;background:#fff;color:var(--brand);font-weight:700;border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.m .wk .rng{flex:1}
.wk .tw{border:none;background:transparent;color:#ffd34d;font-weight:700;font-size:12px;padding:0 8px}
.acct{grid-area:acct;position:relative}
.av{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:linear-gradient(135deg,#f6a5c0,#7c5cd6);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px}
.amenu{position:absolute;right:0;top:calc(100% + 10px);width:300px;background:#fff;color:var(--text);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:60}
.m .amenu{width:340px;right:-4px}
.amenu .who{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--tint)}
.amenu .who small{color:var(--muted);display:block}
.amenu .sec{padding:10px 16px;border-top:1px solid var(--border)}
.amenu h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.amenu .row{display:flex;align-items:center;justify-content:space-between;font-size:14px;min-height:40px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);font-size:16px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.times label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.times input{border:1px solid var(--border);border-radius:8px;padding:6px;font-size:13px;width:100%}
.amenu .out{display:block;width:100%;border:none;border-top:1px solid var(--border);background:none;padding:12px 16px;text-align:left;color:#c0392b;font-size:14px;min-height:44px}
.amenu .ver{padding:8px 16px 12px;font-size:11px;color:var(--muted);background:var(--bg2)}

/* bottom nav (mobile) */
.bnav{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 18px;z-index:30}
.bnav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-width:64px;min-height:44px}
.bnav button i{font-style:normal;font-size:20px}
.bnav button.on{color:var(--brand);font-weight:700}

/* common bits */
.page{max-width:1240px;margin:0 auto;padding:20px 20px 30px}
.m .page{padding:12px 12px 20px}
h2.title{margin:0;color:var(--brand);font-size:28px}
.m h2.title{font-size:22px}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 13px;font-size:14px;min-height:44px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand-light);background:var(--tint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.on{background:var(--tint);border-color:var(--brand-light);color:var(--brand);font-weight:600}
.btn.green{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.mchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.mc{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.mc.lg{font-size:13px;padding:4px 10px}
.s-on{background:rgba(40,167,69,.15);color:#1b6b2e}.s-near{background:rgba(255,193,7,.22);color:#856404}
.s-under{background:rgba(74,163,240,.2);color:#10527f}.s-over{background:rgba(220,53,69,.15);color:#a71d2a}
.ondark .mc{background:#fff}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.b-cheat{background:var(--cheat);color:#fff}.b-plan{background:var(--tint);color:var(--brand)}
.kebab{width:36px;height:36px;border:none;background:transparent;border-radius:8px;color:var(--muted);font-size:18px;flex:none}
.kebab:hover{background:var(--bg2)}
.pop{position:absolute;right:6px;top:40px;z-index:25;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:210px}
.pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 11px;font-size:14px;border-radius:7px}
.pop button:hover{background:var(--tint)}
.pop .danger{color:var(--err)}
.pop hr{border:none;border-top:1px solid var(--border);margin:4px 0}

/* ---------- RECIPES ---------- */
.rtool{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m .rtool{position:sticky;top:-12px;z-index:10;background:var(--bg2);margin:-12px -12px 0;padding:12px 12px 8px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:0 12px;height:44px}
.m .search{flex-basis:100%;order:-1;height:42px}
.search input{border:none;outline:none;flex:1;font-size:15px;background:transparent;min-width:0}
.tabs{display:flex;gap:6px}
.m .tabs{flex-basis:100%;justify-content:space-between}
.tab{border:1px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;color:var(--muted);white-space:nowrap;min-height:40px}
.m .tab{flex:1;padding:7px 0;font-size:13px}
.tab .n{font-size:11px;opacity:.7;margin-left:3px}
.m .tab .n{display:none}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.fchip{border:1px dashed #c9c3e6;background:transparent;border-radius:999px;padding:8px 12px;font-size:13px;color:var(--brand-light);white-space:nowrap;min-height:38px}
.fchip.on{border-style:solid;background:var(--tint);color:var(--brand);font-weight:600}
.strip{margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.strip-h{display:flex;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.strip-h .gap{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:#9a5b00}
.strip-h .gap.full{color:#1b6b2e}
.sdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sday{border:1px solid var(--border);background:var(--bg2);border-radius:10px;padding:6px 8px;text-align:left;min-height:56px;display:flex;flex-direction:column;gap:2px}
.sday .d{font-size:12px;font-weight:700}.sday .d span{font-weight:400;color:var(--muted)}
.sday .r{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sday.empty{border:1.5px dashed var(--amber);background:#fffaf0}
.sday.empty .r{color:#9a5b00;font-weight:600}
.sday.today{box-shadow:inset 0 0 0 2px var(--brand)}
.sday.picking{background:var(--brand);border-color:var(--brand);color:#fff}
.sday.picking .r,.sday.picking .d span{color:#e0dcf5}
.m .sday{min-height:46px;padding:5px 2px;align-items:center;text-align:center}
.m .sday .r{display:none}
.sday .dot{display:none;width:7px;height:7px;border-radius:50%;background:#b8b2d6;margin-top:2px}
.m .sday .dot{display:block}
.m .sday.empty .dot{background:var(--amber)}
.pickbar{margin-top:12px;background:var(--brand);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.pickbar button{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:8px 12px;min-height:40px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.m .rgrid{grid-template-columns:1fr;gap:10px;margin-top:10px}
.rcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.m .rcard{padding:12px;gap:9px}
.rcard.inplan{border-color:#cfc9ea;box-shadow:inset 4px 0 0 var(--brand)}
.rcard.ishidden{opacity:.65;background:var(--bg2)}
.rtop{display:flex;gap:8px;align-items:flex-start}
.rname{flex:1;font-size:16px;font-weight:700;line-height:1.25;border:none;background:none;text-align:left;padding:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rname:hover{color:var(--brand)}
.vseg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border-radius:10px;padding:3px;gap:3px}
.vseg button{border:none;background:transparent;border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);min-height:42px;justify-content:center}
.vseg button b{font-size:14px;color:var(--text)}
.vseg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--brand)}
.vseg button.on b{color:var(--brand)}
.single{font-size:14px;font-weight:700}.single span{font-weight:400;color:var(--muted);font-size:12px}
.rrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ppl{margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--brand);font-weight:600;min-height:32px}
.stepper{position:absolute;right:10px;z-index:25;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;gap:8px;align-items:center}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);font-size:18px}
.stepper b{min-width:28px;text-align:center}
.dlabel{font-size:12px;color:var(--muted)}
.dbtns{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dbtn{position:relative;height:42px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
.m .dbtn{font-size:12px;height:40px}
.dbtn:hover{border-color:var(--brand-light);color:var(--brand)}
.dbtn.other{background:var(--bg2);color:#9aa1a8}
.dbtn.other::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#b8b2d6}
.dbtn.mine{background:var(--brand);border-color:var(--brand);color:#fff}
.dbtn.mine::before{content:"✓ "}
.addto{width:100%;min-height:46px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px}
.addto.done{background:var(--ok)}
.note{grid-column:1/-1;background:#fff;border:1px dashed #c9c3e6;border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.unhide{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:10px 12px;font-weight:600;min-height:44px}
.extra-note{font-size:12px;color:var(--muted);background:var(--bg2);border-radius:8px;padding:8px 10px}

/* ---------- MEAL PLAN (web) ---------- */
.mptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mptop .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;position:relative}
.wsum{margin-top:16px;display:grid;grid-template-columns:2.4fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--brand-light)}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:22px;font-weight:800;color:var(--brand);margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.wtile{display:flex;align-items:center;gap:26px}
.wtile .mac{border-left:1px solid var(--border);padding-left:22px}
.wtile .more{margin-left:auto;align-self:flex-end;color:var(--brand-light);font-size:13px;font-weight:600}
.stale{background:#fff7e6;border-color:#f3d39a}
.stale .v{color:#9a5b00;font-size:15px}
.stale .go{border:none;background:var(--brand);color:#fff;border-radius:8px;padding:7px 11px;font-size:13px;margin-top:6px}
.tt{margin-top:18px;display:grid;grid-template-columns:96px repeat(7,minmax(0,1fr));gap:8px}
.dh{background:#fff;border:1px solid var(--border);border-radius:12px 12px 6px 6px;padding:9px 10px 8px;position:relative}
.dh.today{background:var(--brand);border-color:var(--brand);color:#fff}
.dh .n{font-weight:800}.dh .dt{font-size:13px;opacity:.75;margin-left:4px}
.dh .sw{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;opacity:.6;font-size:14px}
.dh .sw:hover{opacity:1;border-color:currentColor}
.dh .mac{display:block;width:100%;border:none;background:none;text-align:left;padding:0;margin-top:6px}
.dh .kc{font-size:13px;font-weight:700;display:block;margin-bottom:3px}
.rl{display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.rl span{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.cell{min-height:96px;display:flex;flex-direction:column;gap:6px;border-radius:8px}
.cell.tcol{background:var(--tint);padding:4px;margin:-4px}
.cell.drop{outline:2px dashed var(--brand);outline-offset:2px}
.mcard{position:relative;background:#fff;border:1px solid var(--border);border-left:4px solid var(--brand-light);border-radius:8px;padding:8px 8px 8px 10px;cursor:pointer}
.mcard:hover{box-shadow:0 4px 6px rgba(0,0,0,.08)}
.mcard.eaten{background:#eef8f0;border-left-color:var(--ok)}
.mcard .nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:22px}
.mcard .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.mcard .ppb{background:var(--tint);color:var(--brand);border-radius:999px;padding:1px 7px;font-weight:600;font-size:11px}
.tick{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid #cfd4da;background:#fff;display:grid;place-items:center;font-size:12px;color:transparent;flex:none}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.eaten .tick{background:var(--ok);border-color:var(--ok);color:#fff;cursor:default}
.mcard .kebab{position:absolute;right:2px;top:2px;width:28px;height:28px;font-size:15px;opacity:.5}
.mcard:hover .kebab{opacity:1}
.mcard .pop{top:30px}
.add{border:1.5px dashed #cfcbe0;background:transparent;border-radius:8px;color:var(--brand-light);font-size:12px;font-weight:600;padding:8px;min-height:44px}
.add:hover{background:var(--tint);border-color:var(--brand-light)}
.add.ghost{opacity:0}
.cell:hover .add.ghost,.add.ghost:focus{opacity:.75}

/* MEAL PLAN (mobile) */
.mphead{background:#fff;border-bottom:1px solid var(--border);margin:-12px -12px 0;padding:10px 12px;position:sticky;top:-12px;z-index:10}
.mphead .t{display:flex;align-items:center;gap:8px}
.wbar{margin-top:8px;width:100%;display:flex;align-items:center;gap:8px;background:var(--tint);border:none;border-radius:12px;padding:8px 10px;font-size:13px;text-align:left;color:var(--brand)}
.wbar b{white-space:nowrap}.wbar .mchips{flex-wrap:nowrap}.wbar .go{margin-left:auto}
.chips{display:flex;gap:5px;margin-top:8px}
.chip{flex:1;border:1px solid var(--border);background:#fff;border-radius:12px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
.chip .a{font-size:11px;color:var(--muted)}.chip .b{font-size:16px;font-weight:800}
.chip .pips{display:flex;gap:2px}.chip .pips i{width:5px;height:5px;border-radius:50%;background:#d8d4ea}.chip .pips i.f{background:var(--ok)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.on .a{color:#d9d4f5}
.chip.today:not(.on){box-shadow:inset 0 0 0 2px #ffd34d}
.dsum{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.dsum .big{font-size:20px;font-weight:800;color:var(--brand)}.dsum .sm{font-size:12px;color:var(--muted)}
.dsum .go{margin-left:auto;color:var(--brand-light);font-size:20px}
.slot{margin-top:14px}
.slot-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin:0 2px 6px}
.slot-h span{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
.sw-row{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px}

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dt(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function iso(d){return d.toISOString().slice(0,10)}
function addD(isoS,n){const d=dt(isoS);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function weekDays(){const start=addD('2026-11-09',U.weekOff*7);return [...Array(7)].map((_,i)=>{const s=addD(start,i),d=dt(s);return{iso:s,dow:DOW[d.getUTCDay()],n:d.getUTCDate(),mon:MON[d.getUTCMonth()],today:s===TODAY}})}
function rangeLabel(a,b){const A=dt(a),B=dt(b);return A.getUTCMonth()===B.getUTCMonth()?`${MON[A.getUTCMonth()]} ${A.getUTCDate()} – ${B.getUTCDate()}`:`${MON[A.getUTCMonth()]} ${A.getUTCDate()} – ${MON[B.getUTCMonth()]} ${B.getUTCDate()}`}

function macroStatus(m,scope){ // scope: 'day' | 'meal'
  const kc=m.p*4+m.c*4+m.f*9||1,cp=m.c*4/kc*100,fp=m.f*9/kc*100,floor=scope==='day'?100:35;

function weekStats(){const days=weekDays();let k=0,p=0,c=0,f=0,planned=0;days.forEach(d=>{const t=dayTotals(d.iso);k+=t.k;p+=t.p;c+=t.c;f+=t.f;planned+=MEALS.filter(m=>slot(d.iso,m.k)).length});

   ========================================================= */
function generate(from,to){
  const items={};
  for(let d=from;d<=to;d=addD(d,1)){const day=S.plan[d]||{};Object.entries(day).forEach(([meal,e])=>{if(!e)return;const r=RB[e.rid];
    r.ing.forEach(([n,q,u,a])=>{const key=n+'|'+u;items[key]=items[key]||{key,n,u,a,q:0,uses:[]};items[key].q+=q*e.srv;items[key].uses.push({d,meal,name:r.name,q:q*e.srv})})})}
  S.shopping={from,to,v:S.version,at:'Sat 14 Nov, 13:02',items:Object.values(items)};S.shoppingChecks={};
}
function shopStale(){const L=S.shopping;return !!L&&S.changes.some(c=>c.v>L.v&&c.date>=L.from&&c.date<=L.to)}
const fq=(q)=>{const r=Math.round(q*100)/100;return r%1?String(r):String(r)};

  const counts=Object.fromEntries(TABS.map(t=>[t,RECIPES.filter(r=>r.meal===t&&!isHid(r)).length]));
  const hiddenN=RECIPES.filter(isHid).length;

  </div>`;
  if(!U.showHidden&&S.signedIn&&meal!=='extras')h+=weekStrip(meal);
  if(U.pick&&!U.showHidden){const d=weekDays().find(x=>x.iso===U.pick.date);h+=`<div class="pickbar">Picking <b>${TABL[meal].toLowerCase()}</b> for <b>${d.dow} ${d.n}</b>. Tap “Add to ${d.dow}” on any recipe.<button data-a="cancelPick">Cancel</button></div>`}
  h+=`<div class="rgrid">`;
  if(U.showHidden)h+=`<div class="note">🙈 <b>Hidden recipes.</b> These don't show in your lists. Meals already in your plan stay put.${list.length?'':'<br>Nothing hidden in '+TABL[meal]+'.'}</div>`;
  list.forEach(r=>h+=recipeCard(r,mob));
  if(!list.length&&!U.showHidden)h+=`<div class="note">No ${TABL[meal].toLowerCase()} recipes match “${esc(U.query)}”.</div>`;

function weekStrip(meal){
  const days=weekDays(),empt=days.filter(d=>!slot(d.iso,meal)).length;
  return `<div class="strip"><div class="strip-h">This week's ${TABL[meal].toLowerCase()}<span class="gap ${empt?'':'full'}">${empt?`${empt} day${empt>1?'s':''} still empty`:'All 7 days planned ✓'}</span></div>
   <div class="sdays">${days.map(d=>{const e=slot(d.iso,meal);
     return `<button class="sday ${e?'':'empty'} ${d.today?'today':''} ${U.pick?.date===d.iso?'picking':''}" ${e?`data-a="viewEntry" data-d="${d.iso}" data-m="${meal}"`:`data-a="startPick" data-d="${d.iso}"`} title="${e?esc(RB[e.rid].name):'Pick '+meal+' for '+d.dow}">
       <span class="d">${d.dow} <span>${d.n}</span></span><span class="r">${e?esc(RB[e.rid].name):'+ Pick one'}</span><span class="dot"></span></button>`}).join('')}</div></div>`}
function recipeCard(r){
  const vi=cardVar(r),v=r.vars[vi],srv=cardSrv(r),ip=inPlan(r),hid=S.hidden.has(r.id),meal=U.meal;
  const seg=r.vars.length>1?`<div class="vseg" role="radiogroup" aria-label="Variant">${r.vars.map((x,i)=>`<button role="radio" aria-checked="${i===vi}" class="${i===vi?'on':''}" data-a="var" data-r="${r.id}" data-v="${i}">${x.l}<b>${x.k}</b></button>`).join('')}</div>`
    :`<div class="single">${v.k} kcal <span>per serving</span></div>`;
  let days='';
  if(hid)days=`<button class="unhide" data-a="unhide" data-r="${r.id}">👁 Unhide</button>`;
  else if(meal==='extras')days=`<div class="extra-note">Extras are made as part of other recipes. Open a recipe that uses it to choose homemade or store-bought.</div>`;
  else if(!S.signedIn)days='';
  else if(U.pick){const e=slot(U.pick.date,meal),d=weekDays().find(x=>x.iso===U.pick.date),mine=e&&e.rid===r.id;
    days=`<button class="addto ${mine?'done':''}" data-a="assign" data-r="${r.id}" data-d="${U.pick.date}">${mine?`✓ On ${d.dow}`:`${e?'Replace on':'Add to'} ${d.dow} ${d.n}`}</button>`}
  else days=`<div class="dlabel">Add to a day</div><div class="dbtns">${weekDays().map(d=>{const e=slot(d.iso,meal),cls=e?(e.rid===r.id?'mine':'other'):'';
      const t=e?(e.rid===r.id?`Remove from ${d.dow}`:`Replace ${RB[e.rid].name} on ${d.dow}`):`Add to ${d.dow}`;
      return `<button class="dbtn ${cls}" title="${esc(t)}" aria-label="${esc(t)}" data-a="assign" data-r="${r.id}" data-d="${d.iso}">${d.dow}</button>`}).join('')}</div>`;
  return `<article class="rcard ${ip?'inplan':''} ${hid?'ishidden':''}">
    <div class="rtop"><button class="rname" data-a="viewRecipe" data-r="${r.id}">${esc(r.name)}</button>${r.cheat?'<span class="badge b-cheat">Cheat</span>':''}
      <button class="kebab" data-a="menu" data-v="r-${r.id}" aria-label="More actions">⋯</button></div>
    ${U.menu==='r-'+r.id?`<div class="pop" data-stop><button data-a="viewRecipe" data-r="${r.id}">📖 View recipe</button>${S.signedIn?(hid?`<button data-a="unhide" data-r="${r.id}">👁 Unhide</button>`:`<button data-a="hide" data-r="${r.id}">🙈 Hide from my recipes</button>`):''}</div>`:''}
    ${seg}
    <div class="rrow">${chips(v,'meal')}<button class="ppl" data-a="stepper" data-r="${r.id}">👥 ${srv} ▾</button>${ip?'<span class="badge b-plan">In plan</span>':''}</div>
    ${U.stepper===r.id?`<div class="stepper" data-stop><button data-a="srv" data-r="${r.id}" data-v="-1">−</button><b>${srv}</b><button data-a="srv" data-r="${r.id}" data-v="1">+</button></div>`:''}
    ${days}
  </article>`}

        <div class="mac"><div class="k">Week macros <span style="text-transform:none;letter-spacing:0">(avg / day)</span></div><div style="margin-top:6px">${chips(w.mac,'day',1)||'<span class="s">Nothing planned yet</span>'}</div></div><span class="more">Details ›</span></div>

      <button class="mac ${d.today?'ondark':''}" data-a="dayMacros" data-d="${d.iso}"><span class="kc">${t.k.toLocaleString()} kcal</span>${chips(t,'day')}</button></div>`});

    h+=`<div class="rl">${m.e} ${m.l}<span>${m.k==='snacks'?'':S.times[MEALS.indexOf(m)]}</span></div>`;
    days.forEach(d=>{const e=slot(d.iso,m.k);
      h+=`<div class="cell ${d.today?'tcol':''}" data-drop="${d.iso}|${m.k}">`;
      if(e){const v=variant(e),r=RB[e.rid],mid=`e-${e.id}`;
        h+=`<div class="mcard ${e.eaten?'eaten':''}" draggable="true" data-drag="${d.iso}|${m.k}" data-a="viewEntry" data-d="${d.iso}" data-m="${m.k}">
          <div class="nm">${esc(r.name)}</div>
          <div class="meta">${v.k} kcal <span class="ppb" title="${ppl(e.srv)}">👥 ${e.srv}</span>${r.ing.some(i=>i[0].includes('protein bar'))?'<span style="color:var(--cart)" title="Store-bought">🛒</span>':''}

  h+=`</div>`;

function shoppingPage(mob){
  const L=S.shopping,days=weekDays();
  let h=`<div class="page"><div class="shtop"><div><h2 class="title">Shopping list</h2>${L?`<div class="meta">For <b>${rangeLabel(L.from,L.to)}</b> · made ${L.at}</div>`:''}</div>

      ${U.menu==='shop'?`<div class="pop" style="top:50px;right:0" data-stop><button data-a="genDlg" data-v="week">↻ ${L?'Regenerate':'Make list'} for ${rangeLabel(days[0].iso,days[6].iso)}</button><button data-a="genDlg" data-v="custom">📅 New list for other dates…</button>${L?`<button data-a="uncheckDlg">☐ Uncheck all…</button>`:''}</div>`:''}</div></div>`;

  const aisles={};L.items.forEach(i=>{(aisles[i.a]=aisles[i.a]||[]).push(i)});
  const all=L.items,done=all.filter(i=>S.shoppingChecks[i.key]).length,pct=all.length?Math.round(done/all.length*100):0;
  h+=`<div class="prog"><span class="big">${done} / ${all.length}</span><div class="bar"><i style="width:${pct}%"></i></div><span class="sm">${pct===100?'All done 🎉':pct+'% in the basket'}</span></div>`;
  if(shopStale())h+=`<div class="sstale">⚠️ Your meal plan changed after this list was made.<button data-a="regen">Regenerate</button></div>`;
  const order=Object.keys(AISLE).filter(a=>aisles[a]).sort((a,b)=>{const da=aisles[a].every(i=>S.shoppingChecks[i.key]),db=aisles[b].every(i=>S.shoppingChecks[i.key]);return da-db});
  h+=`<div class="aisles">${order.map(a=>{const items=[...aisles[a]].sort((x,y)=>(!!S.shoppingChecks[x.key]-!!S.shoppingChecks[y.key])||x.n.localeCompare(y.n));
    const tick=items.filter(i=>S.shoppingChecks[i.key]).length,isDone=tick===items.length,open=U.aisleOpen[a]??!isDone,col=`var(${AISLE[a][1]})`;
    const shown=U.hideTicked?items.filter(i=>!S.shoppingChecks[i.key]):items;
    return `<div class="aisle ${isDone?'done':''}"><button class="ah" data-a="aisle" data-v="${a}" aria-expanded="${open}"><span class="dot" style="background:${col}"></span><b>${isDone?'✓ ':''}${AISLE[a][0]}</b><span class="cnt">${tick}/${items.length}</span><span>${open?'▾':'▸'}</span></button>
      ${open?`<div>${shown.map(i=>{const on=!!S.shoppingChecks[i.key];return `<div class="it ${on?'on':''}" data-a="check" data-v="${esc(i.key)}" role="checkbox" aria-checked="${on}"><span class="ck" style="${on?`background:${col};border-color:${col}`:''}">✓</span><span class="qty">${fq(i.q)} ${i.u}</span><span class="inm">${esc(i.n)}</span><button class="info" data-a="breakdown" data-v="${esc(i.key)}" title="Which meals use this?">ⓘ</button></div>`}).join('')}
      ${U.hideTicked&&tick&&!isDone?`<div class="hnote">${tick} ticked hidden</div>`:''}</div>`:''}</div>`}).join('')}</div>`;
  return h+`</div>`}

/* ---------------- PIP ---------------- */
function pipPage(){return `<div class="pip"><div><div class="herb">🌱</div><h2>Pip's room</h2><p>Pip isn't part of this redesign, so the room stays exactly as it is today. On desktop the header is hidden here (as now) and the bottom nav stays, so you can get back.</p></div></div>`}

/* ---------------- DIALOGS ---------------- */
function dialog(mob){
  const D=U.dlg,x=`<button class="x" data-a="close" aria-label="Close">×</button>`;let b='';
  const dayOf=iso=>weekDays().find(d=>d.iso===iso)||{dow:DOW[dt(iso).getUTCDay()],n:dt(iso).getUTCDate(),mon:MON[dt(iso).getUTCMonth()]};
  if(D.t==='recipe'){const r=RB[D.r],vi=D.v??cardVar(r),v=r.vars[vi],srv=D.srv??cardSrv(r);
    b=`${x}<h3>${r.emoji} ${esc(r.name)}</h3><p>${r.cheat?'<span class="badge b-cheat">Cheat</span> ':''}${ppl(srv)} · ${v.k} kcal per serving</p>
     ${r.vars.length>1?`<div class="vseg">${r.vars.map((y,i)=>`<button class="${i===vi?'on':''}" data-a="dlgVar" data-v="${i}">${y.l}<b>${y.k}</b></button>`).join('')}</div>`:''}
     <div style="margin:10px 0">${chips(v,'meal',1)}</div>
     ${r.ing.length?`<div class="grp">Ingredients (${ppl(srv)})</div><ul class="ingl">${r.ing.map(([n,q,u])=>`<li><b>${fq(q*srv)} ${u}</b>${esc(n)}</li>`).join('')}</ul>`:''}
     <p style="font-size:12px">The existing recipe view (steps, extras, cook mode) opens here; it's unchanged.</p>
     ${D.entry&&tickable(D.entry.d)&&!slot(D.entry.d,D.entry.m)?.eaten?`<button class="big" data-a="tick" data-d="${D.entry.d}" data-m="${D.entry.m}">Mark as eaten</button>`:''}`}
  else if(D.t==='dayMacros'){const t=dayTotals(D.d),s=macroStatus(t,'day'),d=dayOf(D.d);
    b=`${x}<h3>${d.dow} ${d.mon} ${d.n}: macros</h3><p>Existing daily macro popup.</p><div class="row"><span>Calories</span><b>${t.k} kcal</b></div><div class="row"><span>Protein</span><b>${s.p} g</b></div><div class="row"><span>Carbs</span><b>${s.cp}% of kcal</b></div><div class="row"><span>Fat</span><b>${s.fp}% of kcal</b></div><div style="margin-top:10px">${chips(t,'day',1)}</div>`}
  else if(D.t==='weekMacros'){const w=weekStats();b=`${x}<h3>Week macros</h3><p>Existing weekly macro popup.</p><div class="row"><span>Week total</span><b>${w.k.toLocaleString()} kcal</b></div><div class="row"><span>Average per day</span><b>${w.avg.toLocaleString()} kcal</b></div><div class="row"><span>Meals planned</span><b>${w.planned} / 21</b></div><div style="margin-top:10px">${chips(w.mac,'day',1)}</div>`}
  else if(D.t==='swap'){const d=dayOf(D.d);b=`${x}<h3>Swap ${d.dow} ${d.n} with…</h3><p>All of that day's meals trade places (existing Swap days modal).</p>${weekDays().filter(o=>o.iso!==D.d).map(o=>`<button class="opt" data-a="doSwap" data-d="${D.d}" data-v="${o.iso}">${o.dow} ${o.mon} ${o.n}<small>${MEALS.filter(m=>slot(o.iso,m.k)).length} meals</small></button>`).join('')}`}
  else if(D.t==='move'){const e=slot(D.d,D.m),r=RB[e.rid];b=`${x}<h3>Move ${esc(r.name)}</h3><p>Pick a day and meal. Onto a filled slot, the two meals swap.</p>${weekDays().map(o=>`<div class="grp">${o.dow} ${o.mon} ${o.n}</div>${MEALS.map(m=>{const t=slot(o.iso,m.k),same=o.iso===D.d&&m.k===D.m;return `<button class="opt" ${same?'disabled':''} data-a="doMove" data-d="${D.d}" data-m="${D.m}" data-v="${o.iso}|${m.k}">${m.e} ${m.l}<small>${same?'current':t?'swap with '+esc(RB[t.rid].name):'empty'}</small></button>`}).join('')}`).join('')}`}
  else if(D.t==='servings'){const e=slot(D.d,D.m);b=`${x}<h3>Servings</h3><p>${esc(RB[e.rid].name)}</p><div class="row"><span>People</span><div class="step"><button data-a="dlgSrv" data-v="-1">−</button><b>${D.n}</b><button data-a="dlgSrv" data-v="1">+</button></div></div><button class="big" data-a="saveSrv">Save</button>`}
  else if(D.t==='weekSheet'){b=`${x}<h3>This week</h3>${[['copy','⧉ Copy week…'],['swap2','⇄ Swap two days…'],['extras','🛒 Manage extras…'],['save','🗂 Save as template…'],['apply','📥 Apply template…'],['manage','⚙️ Manage templates…']].map(([k,l])=>`<button class="opt" data-a="${k==='swap2'?'swapToday':'info'}" data-v="${k}">${l}</button>`).join('')}`}
  else if(D.t==='info'){const T={copy:'Copy week',save:'Save as template',apply:'Apply template',manage:'Manage templates',extras:'Manage extras'};b=`${x}<h3>${T[D.v]}</h3><p>The existing ${T[D.v].toLowerCase()} dialog opens here, unchanged by the redesign.</p><button class="big" data-a="close">OK</button>`}
  else if(D.t==='gen'){const days=weekDays(),n=days.reduce((a,d)=>a+MEALS.filter(m=>slot(d.iso,m.k)).length,0);
    b=`${x}<h3>${S.shopping?'New shopping list':'Make a shopping list'}</h3><p>Builds the list from your meal plan.</p>
     <div class="row"><span>Meal plan week</span><b>${days[0].dow} ${days[0].n} – ${days[6].dow} ${days[6].n} ${days[6].mon}</b></div><div class="row"><span>Meals in it</span><b>${n}</b></div>
     ${D.custom?`<div class="dates"><label>From<input type="date" value="${days[0].iso}"></label><label>To<input type="date" value="${days[6].iso}"></label></div>`:''}
     ${S.shopping?`<div class="warn">This replaces your current list. Ticks are reset.</div>`:''}
     <button class="big" data-a="doGen">Make list for ${D.custom?'these dates':rangeLabel(days[0].iso,days[6].iso)}</button>${D.custom?'':`<button class="link" data-a="genCustom">Choose other dates…</button>`}`}
  else if(D.t==='uncheck'){b=`${x}<h3>Uncheck all items?</h3><p>Every item goes back to unticked. Your list itself doesn't change.</p><button class="big" data-a="doUncheck">Uncheck all</button><button class="link" data-a="close">Cancel</button>`}
  else if(D.t==='breakdown'){const i=S.shopping.items.find(y=>y.key===D.v);b=`${x}<h3>${esc(i.n)}</h3><p>Used in these meals (existing breakdown popup):</p>${i.uses.map(u=>{const d=dayOf(u.d);return `<div class="row"><span>${d.dow} · ${esc(u.name)}</span><b>${fq(u.q)} ${i.u}</b></div>`}).join('')}<div class="row"><span><b>Total</b></span><b>${fq(i.q)} ${i.u}</b></div>`}
  else if(D.t==='login'){b=`${x}<div class="login">${LOGO}<h3>Welcome to My Pantry Plan</h3><p>Sign in to unlock all features</p><button class="gbtn" data-a="doSignin">G&nbsp; Sign in with Google</button></div>`}
  else if(D.t==='date'){b=`${x}<h3>Pick a week</h3><p>The native date picker opens here. Choose any date and the week starts there.</p>${[-2,-1,0,1,2].map(o=>`<button class="opt" data-a="week" data-v="${o}" data-abs="1">${rangeLabel(addD('2026-11-09',o*7),addD('2026-11-15',o*7))}${o===0?'<small>this week</small>':''}</button>`).join('')}`}
  return `<div class="scrim" data-a="scrim"><div class="dlg" role="dialog" aria-modal="true" data-stop>${b}</div></div>`}

/* =========================================================
   Actions
   ========================================================= */
function setSlot(date,meal,entry){S.plan[date]=S.plan[date]||{};if(entry)S.plan[date][meal]=entry;else delete S.plan[date][meal];change(date)}
const A={
  mode:d=>{U.mode=d.v;U.menu=null;U.acct=false;U.swipeOpen=null;U._resetScroll=true},
  reset:()=>{seq=1;try{localStorage.removeItem('fb.mealplan.swipeHintSeen')}catch{};const m=U.mode;fresh();U.mode=m},
  go:d=>{if(!S.signedIn&&d.v!=='recipes'){toast('Sign in to use '+(d.v==='pet'?'Pip':d.v==='mealplan'?'meal planning':'the shopping list'));return}U.route=d.v;U.pick=null;U.menu=null;U.acct=false;U._resetScroll=true},
  week:d=>{U.weekOff=d.abs?+d.v:(+d.v===0?0:U.weekOff+ +d.v);U.pick=null;U.dlg=null;U.mobDay=U.weekOff===0?5:0},
  pickdate:()=>{U.dlg={t:'date'}},
  acct:()=>{U.acct=!U.acct},
  portions:d=>{S.portions=Math.max(1,Math.min(20,S.portions+ +d.v));U.cardSrv={}},
  signout:()=>{S.signedIn=false;U.acct=false;U.route='recipes';U.dlg={t:'login'}},
  signin:()=>{U.dlg={t:'login'}},
  doSignin:()=>{S.signedIn=true;U.dlg=null;toast('Signed in')},
  close:()=>{U.dlg=null},scrim:(d,e)=>{if(e.target.dataset.a==='scrim')U.dlg=null},
  menu:d=>{U.menu=U.menu===d.v?null:d.v;U.stepper=null},
  undo:()=>{if(U.toast?.undo)U.toast.undo();U.toast=null},
  info:d=>{U.menu=null;U.dlg={t:'info',v:d.v}},
  // recipes
  tab:d=>{U.meal=d.v;U.pick=null;U.menu=null},
  showHidden:()=>{U.showHidden=!U.showHidden;U.pick=null},
  var:d=>{U.cardVar[d.r]=+d.v},
  stepper:d=>{U.stepper=U.stepper===d.r?null:d.r;U.menu=null},
  srv:d=>{U.cardSrv[d.r]=Math.max(1,Math.min(20,cardSrv(RB[d.r])+ +d.v))},
  viewRecipe:d=>{U.menu=null;U.dlg={t:'recipe',r:d.r}},
  viewEntry:(d,e)=>{if(e.target.closest('.tick,.kebab,.pop'))return;const en=slot(d.d,d.m);U.dlg={t:'recipe',r:en.rid,v:en.v,srv:en.srv,entry:{d:d.d,m:d.m}}},
  dlgVar:d=>{U.dlg.v=+d.v},
  hide:d=>{const r=RB[d.r];S.hidden.add(r.id);U.menu=null;toast(`Hid ${r.name}`,()=>{S.hidden.delete(r.id)})},
  unhide:d=>{const r=RB[d.r];S.hidden.delete(r.id);U.menu=null;toast(`${r.name} is back in ${TABL[r.meal]}`)},
  startPick:d=>{U.pick={date:d.d,from:null}},
  cancelPick:()=>{const from=U.pick?.from;U.pick=null;if(from==='mealplan'){U.route='mealplan';U._resetScroll=true}},
  assign:d=>{const r=RB[d.r],meal=U.meal==='snacks'?'snacks':U.meal,cur=slot(d.d,meal),day=weekDays().find(x=>x.iso===d.d);
    if(cur&&cur.rid===r.id&&!U.pick){setSlot(d.d,meal,null);toast(`Removed from ${day.dow}`)}
    else if(cur&&cur.rid===r.id){/* already there */}
    else{setSlot(d.d,meal,{id:seq++,rid:r.id,v:cardVar(r),srv:cardSrv(r),eaten:false});toast(cur?`Added to ${day.dow} · replaced ${RB[cur.rid].name}`:`Added to ${day.dow}`)}
    if(U.pick){const from=U.pick.from;U.pick=null;if(from==='mealplan'){U.route='mealplan';U._resetScroll=true}}},
  // meal plan
  addFor:d=>{U.menu=null;U.swipeOpen=null;U.route='recipes';U.meal=d.m;U.query='';U.showHidden=false;U.pick={date:d.d,from:'mealplan'};U._resetScroll=true},
  tick:d=>{const e=slot(d.d,d.m);if(!e||e.eaten||!tickable(d.d))return;e.eaten=true;if(U.dlg?.t==='recipe')U.dlg=null;toast('Marked as eaten')},
  remove:d=>{const e=slot(d.d,d.m);U.menu=null;U.swipeOpen=null;setSlot(d.d,d.m,null);toast(`Removed ${RB[e.rid].name}`,()=>{setSlot(d.d,d.m,e)})},
  entryVar:d=>{const e=slot(d.d,d.m);e.v=+d.v;change(d.d);U.menu=null;toast(`Switched to ${variant(e).l}`)},
  servingsDlg:d=>{U.menu=null;U.dlg={t:'servings',d:d.d,m:d.m,n:slot(d.d,d.m).srv}},
  dlgSrv:d=>{U.dlg.n=Math.max(1,Math.min(20,U.dlg.n+ +d.v))},
  saveSrv:()=>{const D=U.dlg;slot(D.d,D.m).srv=D.n;change(D.d);U.dlg=null;toast('Servings updated')},
  moveDlg:d=>{U.menu=null;U.swipeOpen=null;U.dlg={t:'move',d:d.d,m:d.m}},
  doMove:d=>{const [td,tm]=d.v.split('|');moveEntry(d.d,d.m,td,tm);U.dlg=null},
  swap:d=>{U.dlg={t:'swap',d:d.d}},
  swapToday:()=>{const days=weekDays();U.dlg={t:'swap',d:(days[U.mobDay]||days[0]).iso}},
  doSwap:d=>{const a=S.plan[d.d]||{},b=S.plan[d.v]||{};S.plan[d.d]=b;S.plan[d.v]=a;change(d.d);change(d.v);U.dlg=null;toast('Days swapped')},
  dayMacros:d=>{U.dlg={t:'dayMacros',d:d.d}},
  weekMacros:()=>{U.dlg={t:'weekMacros'}},
  weekSheet:()=>{U.dlg={t:'weekSheet'}},
  mobDay:d=>{U.mobDay=+d.v;U.swipeOpen=null},
  // shopping
  regen:()=>{const L=S.shopping;generate(L.from,L.to);toast(`List regenerated for ${rangeLabel(L.from,L.to)}`)},
  genDlg:d=>{U.menu=null;U.dlg={t:'gen',custom:d.v==='custom'}},
  genCustom:()=>{U.dlg.custom=true},
  doGen:()=>{const days=weekDays();generate(days[0].iso,days[6].iso);U.dlg=null;U.aisleOpen={};toast('Shopping list made')},
  uncheckDlg:()=>{U.menu=null;U.dlg={t:'uncheck'}},
  doUncheck:()=>{S.shoppingChecks={};U.aisleOpen={};U.dlg=null},
  check:(d,e)=>{if(e.target.closest('.info'))return;S.shoppingChecks[d.v]=!S.shoppingChecks[d.v];const it=S.shopping.items.find(i=>i.key===d.v);
    const aisleItems=S.shopping.items.filter(i=>i.a===it.a);delete U.aisleOpen[it.a];if(aisleItems.every(i=>S.shoppingChecks[i.key]))toast(`✓ ${AISLE[it.a][0]} done`)},
  aisle:d=>{const items=S.shopping.items.filter(i=>i.a===d.v),isDone=items.every(i=>S.shoppingChecks[i.key]);U.aisleOpen[d.v]=!(U.aisleOpen[d.v]??!isDone)},
  breakdown:d=>{U.dlg={t:'breakdown',v:d.v}},
  hideTicked:()=>{U.hideTicked=!U.hideTicked},
  wake:()=>{U.wake=!U.wake;toast(U.wake?'Screen will stay on while this page is open':'Screen can sleep again')},
};
function moveEntry(fd,fm,td,tm){if(fd===td&&fm===tm)return;const a=slot(fd,fm),b=slot(td,tm);S.plan[td]=S.plan[td]||{};S.plan[fd]=S.plan[fd]||{};
  S.plan[td][tm]=a;if(b)S.plan[fd][fm]=b;else delete S.plan[fd][fm];change(fd);change(td);
  const day=weekDays().find(x=>x.iso===td);toast(b?`Swapped with ${day.dow} ${tm}`:`Moved to ${day.dow} ${tm}`)}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  const inStop=e.target.closest('[data-stop]');
  if(!el){if(!inStop){U.menu=null;U.acct=false;U.stepper=null;if(U.swipeOpen&&!e.target.closest('.sw-row')){U.swipeOpen=null}render()}return}
  const a=el.dataset.a;
  if(!['menu','acct','portions','stepper','srv'].includes(a)){if(!inStop){U.menu=null;U.acct=false}U.stepper=a==='srv'?U.stepper:null}
  if(A[a]){A[a](el.dataset,e);render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a2==='search'){U.query=t.value;render()}if(t.dataset.a2==='time'){S.times[+t.dataset.i]=t.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){U.dlg=null;U.menu=null;U.acct=false;U.stepper=null;render()}});
// drag & drop (web meal plan)
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(!c)return;drag=c.dataset.drag;e.dataTransfer.setData('text/plain',drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(!c||!drag)return;e.preventDefault();document.querySelectorAll('.cell.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(!c||!drag)return;e.preventDefault();const [fd,fm]=drag.split('|'),[td,tm]=c.dataset.drop.split('|');drag=null;moveEntry(fd,fm,td,tm);render()});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.cell.drop').forEach(x=>x.classList.remove('drop'))});
// swipe (mobile meal plan)
let sw=null;
document.addEventListener('pointerdown',e=>{const f=e.target.closest('[data-swipe]');if(!f||e.target.closest('button'))return;
  const base=U.swipeOpen===+f.dataset.swipe?-228:0;sw={f,x0:e.clientX,base,dx:0,moved:false};f.style.transition='none';f.parentNode.classList.remove('hint');f.querySelector('.hand')?.remove()});
document.addEventListener('pointermove',e=>{if(!sw)return;sw.dx=e.clientX-sw.x0;if(Math.abs(sw.dx)>6)sw.moved=true;if(sw.moved)sw.f.style.transform=`translateX(${Math.min(0,Math.max(-240,sw.base+sw.dx))}px)`});
document.addEventListener('pointerup',()=>{if(!sw)return;const {f,moved,base,dx}=sw;sw=null;f.style.transition='';const id=+f.dataset.swipe;
  if(!moved){if(base){U.swipeOpen=null}else{const en=slot(f.dataset.d,f.dataset.m);U.dlg={t:'recipe',r:en.rid,v:en.v,srv:en.srv,entry:{d:f.dataset.d,m:f.dataset.m}}}render();return}
  const open=base+dx<-70;U.swipeOpen=open?id:null;
  if(open&&!U.hintSeen){U.hintSeen=true;try{localStorage.setItem('fb.mealplan.swipeHintSeen','1')}catch{}}
  render()});
document.addEventListener('pointercancel',()=>{if(sw){sw.f.style.transform='';sw=null}});

fresh();render();
</script>
</body>
</html>
